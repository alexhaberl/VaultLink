[package]
name = "vaultlink"
version = "0.1.0-beta.1"
edition = "2021"
license = "MIT"
description = "Secure file sharing for an existing Linux mountpoint"

[dependencies]
argon2 = "0.5"
axum = { version = "0.8", features = ["multipart"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
data-encoding = "2.6"
hmac = "0.12"
http = "1"
futures-util = "0.3"
mime_guess = "2"
percent-encoding = "2"
rand = "0.8"
rpassword = "7"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
rustls-acme = { version = "0.15.3", features = ["axum"] }
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["catch-panic", "limit", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
