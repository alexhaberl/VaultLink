[package]
name = "vaultlink"
version = "0.7.0"
edition = "2021"
license = "MIT"
description = "Secure file sharing for an existing Linux mountpoint"

[workspace]
members = ["fuzz"]
resolver = "2"

[features]
default = []
# Internal facade used by the out-of-tree cargo-fuzz package. This is not a
# supported application API.
fuzzing = []

[dependencies]
argon2 = "0.5"
askama = "=0.16.0"
axum = { version = "0.8", features = ["multipart"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chacha20poly1305 = "0.11"
crc32fast = "1.5"
data-encoding = "2.6"
hmac = "0.13"
http = "1"
http-body = "1"
futures-util = "0.3"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
mime_guess = "2"
memchr = "2"
percent-encoding = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.10"
rpassword = "7"
r2d2 = "0.8"
r2d2_sqlite = "0.35"
rusqlite = { version = "0.40", features = ["bundled", "chrono", "fallible_uint"] }
rustix = { version = "1", features = ["fs", "process"] }
rustls-acme = { version = "0.15.3", features = ["axum"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "1.1"
tower = "0.5"
tower-http = { version = "0.7", features = ["catch-panic", "limit", "request-id", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
tempfile = "3"
webauthn_rp = { version = "=0.3.0", default-features = false, features = ["bin", "serde_relaxed"] }
zeroize = "1.9"

[dev-dependencies]
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
overflow-checks = true
