version: 2
multi-ecosystem-groups:
  rust-runtime:
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Vienna
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Europe/Vienna
    # Keep unmatched 0.x-minor and major updates visible as individual PRs.
    # These groups organize routine updates; they do not filter update findings.
    open-pull-requests-limit: 10
    groups:
      cargo-patch-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
      cargo-stable-minor-updates:
        applies-to: version-updates
        patterns:
          - data-encoding
          - http
          - mime_guess
          - percent-encoding
          - rpassword
          - rustix
          - serde
          - serde_json
          - subtle
          - tempfile
          - thiserror
          - tokio
          - toml
          - url
        update-types:
          - minor
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Vienna
    open-pull-requests-limit: 5
  - package-ecosystem: rust-toolchain
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: rust-runtime
  - package-ecosystem: docker
    directory: "/deploy/docker"
    patterns:
      - rust
    multi-ecosystem-group: rust-runtime
