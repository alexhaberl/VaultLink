name: Refresh release builder

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vaultlink-release-builder-refresh
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/alexhaberl/vaultlink-release-builder

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push native platform by digest
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          builder="vaultlink-release-builder-$ARCHITECTURE"
          metadata="$RUNNER_TEMP/build-metadata.json"
          docker buildx create --driver docker-container --name "$builder" --use
          trap 'docker buildx rm "$builder" >/dev/null 2>&1 || true' EXIT
          docker buildx inspect --bootstrap
          docker buildx build \
            --platform "$PLATFORM" \
            --file deploy/docker/Dockerfile.release-builder \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --metadata-file "$metadata" \
            --provenance=false \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            .
          digest=$(jq -r '."containerimage.digest" // empty' "$metadata")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$digest" >"digest-$ARCHITECTURE"
      - name: Upload platform digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-builder-digest-${{ matrix.architecture }}
          path: digest-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15
    steps:
      - name: Download platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-builder-digest-*
          path: digests
          merge-multiple: true
      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish and report multiarch manifest
        run: |
          set -euo pipefail
          amd64=$(cat digests/digest-amd64)
          arm64=$(cat digests/digest-arm64)
          for digest in "$amd64" "$arm64"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          done
          docker buildx imagetools create \
            --tag "$IMAGE:dependency-refresh" \
            "$IMAGE@$amd64" \
            "$IMAGE@$arm64"
          inspection=$(docker buildx imagetools inspect "$IMAGE:dependency-refresh")
          printf '%s\n' "$inspection"
          manifest_digest=$(printf '%s\n' "$inspection" \
            | sed -n 's/^Digest:[[:space:]]*//p' \
            | head -n 1)
          [[ "$manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          reference="$IMAGE@$manifest_digest"
          printf '## Release builder manifest\n\n`%s`\n' "$reference" >>"$GITHUB_STEP_SUMMARY"
          printf '\nBuilt natively for `linux/amd64` and `linux/arm64` from commit `%s`.\n' \
            "$GITHUB_SHA" >>"$GITHUB_STEP_SUMMARY"
