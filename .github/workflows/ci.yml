name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Native Linux (${{ matrix.architecture }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runs_on: '["self-hosted", "Linux", "X64", "vaultlink"]'
            expected_uname: x86_64
            expected_rust_host: x86_64-unknown-linux-gnu
          - architecture: arm64
            runs_on: '["ubuntu-24.04-arm"]'
            expected_uname: aarch64
            expected_rust_host: aarch64-unknown-linux-gnu
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - name: Verify native architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.expected_uname }}"
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.expected_rust_host }}"
      - name: Supply-chain policy
        run: sh tools/check-supply-chain-policy.sh
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lints
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets
      - name: Fuzz crate compiles
        run: cargo check --manifest-path fuzz/Cargo.toml --locked
      - name: Deployment artifacts
        run: shellcheck deploy/*.sh deploy/docker/*.sh tools/*.sh
      - name: Install pinned cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.2
      - name: Audit application and fuzz lockfiles
        run: |
          cargo audit --deny warnings
          cargo audit --deny warnings --file fuzz/Cargo.lock
      - name: Setup, API, upgrade, and rollback smoke tests
        run: make docker-smoke
      - name: Native ${{ matrix.architecture }} release build on main
        if: github.event_name == 'push'
        run: cargo build --locked --release
