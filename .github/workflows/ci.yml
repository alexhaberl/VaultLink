name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Native Linux (${{ matrix.architecture }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runs_on: '["self-hosted", "Linux", "X64", "vaultlink"]'
            expected_uname: x86_64
            expected_rust_host: x86_64-unknown-linux-gnu
          - architecture: arm64
            runs_on: '["self-hosted", "Linux", "ARM64", "vaultlink"]'
            expected_uname: aarch64
            expected_rust_host: aarch64-unknown-linux-gnu
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Resolve pinned Rust toolchain
        id: rust_toolchain
        shell: bash
        run: echo "channel=$(sh tools/rust-toolchain-channel.sh)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
          components: rustfmt, clippy
      - name: Verify native architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.expected_uname }}"
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.expected_rust_host }}"
      - name: Supply-chain policy
        if: matrix.architecture == 'arm64'
        run: sh tools/check-supply-chain-policy.sh
      - name: Formatting
        if: matrix.architecture == 'arm64'
        run: cargo fmt --all -- --check
      - name: Lints
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets
      - name: Install pinned coverage tool
        if: matrix.architecture == 'arm64'
        run: |
          rustup component add llvm-tools-preview
          cargo install --locked cargo-llvm-cov --version 0.8.6
      - name: Coverage
        if: matrix.architecture == 'arm64'
        run: |
          # Baseline measured on 2026-07-14: 83.74% lines. The initial
          # regression floor is floor(83.74) - 2 percentage points.
          cargo llvm-cov --locked --package vaultlink --all-targets --all-features \
            --lcov --output-path coverage.lcov --fail-under-lines 81
      - name: Upload coverage report
        if: matrix.architecture == 'arm64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: coverage.lcov
          if-no-files-found: error
          retention-days: 14
      - name: Fuzz crate compiles
        run: cargo check --manifest-path fuzz/Cargo.toml --locked
      - name: Deployment artifacts
        if: matrix.architecture == 'arm64'
        run: shellcheck deploy/*.sh deploy/docker/*.sh tools/*.sh
      - name: Install pinned cargo-audit
        if: matrix.architecture == 'arm64'
        run: cargo install --locked cargo-audit --version 0.22.2
      - name: Audit workspace lockfile
        if: matrix.architecture == 'arm64'
        run: cargo audit --deny warnings
      - name: Setup, API, upgrade, and rollback smoke tests
        run: make docker-smoke
      - name: Native ${{ matrix.architecture }} release build on main
        if: github.event_name == 'push'
        run: cargo build --locked --release
