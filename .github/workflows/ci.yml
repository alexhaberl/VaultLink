name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Native Linux (${{ matrix.architecture }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runs_on: '["self-hosted", "Linux", "X64", "vaultlink"]'
            expected_uname: x86_64
            expected_rust_host: x86_64-unknown-linux-gnu
          - architecture: arm64
            runs_on: '["self-hosted", "Linux", "ARM64", "vaultlink"]'
            expected_uname: aarch64
            expected_rust_host: aarch64-unknown-linux-gnu
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve pinned Rust toolchain
        id: rust_toolchain
        shell: bash
        run: echo "channel=$(sh tools/rust-toolchain-channel.sh)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
          components: rustfmt, clippy
      - name: Verify native architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.expected_uname }}"
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.expected_rust_host }}"
      - name: Supply-chain policy
        run: sh tools/check-supply-chain-policy.sh
      - name: Full-history secret scan
        if: matrix.architecture == 'arm64'
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.0
          GITLEAKS_SHA256: b4cbbb6ddf7d1b2a603088cd03a4e3f7ce48ee7fd449b51f7de6ee2906f5fa2f
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/vaultlink-gitleaks.XXXXXXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          archive="$work/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --retry 5 --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$work" gitleaks
          GITLEAKS_BIN="$work/gitleaks" make secret-check
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lints
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Mythos lints
        run: cargo clippy --locked --all-targets --all-features -- -D warnings -W clippy::perf -W clippy::redundant_clone -W clippy::needless_pass_by_value
      - name: Tests
        run: cargo test --locked --all-targets
      - name: Version consistency including executable and health metadata
        run: |
          cargo build --locked --bin vaultlink
          sh tools/check-version-consistency.sh --binary target/debug/vaultlink
      - name: Install pinned coverage tool
        if: matrix.architecture == 'arm64'
        run: |
          rustup component add llvm-tools-preview
          cargo install --locked cargo-llvm-cov --version 0.8.6
      - name: Coverage
        if: matrix.architecture == 'arm64'
        run: |
          # Baseline measured on 2026-07-14: 83.74% lines. The initial
          # regression floor is floor(83.74) - 2 percentage points.
          cargo llvm-cov --locked --package vaultlink --all-targets --all-features \
            --lcov --output-path coverage.lcov --fail-under-lines 81
      - name: Upload coverage report
        if: matrix.architecture == 'arm64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: coverage.lcov
          if-no-files-found: error
          retention-days: 14
      - name: Fuzz crate compiles
        run: cargo check --manifest-path fuzz/Cargo.toml --locked --all-targets
      - name: Deployment artifacts
        run: shellcheck deploy/*.sh deploy/docker/*.sh tools/*.sh
      - name: Install pinned cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.2
      - name: Audit workspace lockfile
        run: cargo audit --deny warnings --ignore RUSTSEC-2023-0071
      - name: Setup, API, root-helper, soak-evidence, upgrade, and rollback smokes
        run: make docker-smoke
      - name: Native ${{ matrix.architecture }} release build on main
        if: github.event_name == 'push'
        run: |
          cargo build --locked --release
          sh tools/check-version-consistency.sh --binary target/release/vaultlink
      - name: Publish exact-commit native gate
        if: ${{ always() && github.event_name == 'push' }}
        env:
          GATE_RESULT: ${{ job.status }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          case "$GATE_RESULT" in
            success) state=success; description='Native CI and release build passed' ;;
            *) state=failure; description='Native CI or release build failed' ;;
          esac
          curl --fail-with-body --silent --show-error \
            --retry 5 \
            --retry-delay 2 \
            --retry-max-time 60 \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "{\"state\":\"$state\",\"context\":\"vaultlink/native-${{ matrix.architecture }}\",\"description\":\"$description\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
