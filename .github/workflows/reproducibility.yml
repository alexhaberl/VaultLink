name: Reproducible native packages

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: vaultlink-package-reproducibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      packages_run: ${{ steps.packages.outputs.packages_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the complete immutable target lock
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/package-targets.py validate
          printf 'matrix=%s\n' "$(python3 tools/package-targets.py matrix)" \
            >>"$GITHUB_OUTPUT"
      - name: Resolve the exact successful package run for this commit
        id: packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          lines=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/statuses?per_page=100" \
            --jq '.[] | select(.context == "vaultlink/packages") | [.state,.target_url] | @tsv')
          line=$(printf '%s\n' "$lines" | sed -n '1p')
          test -n "$line"
          IFS=$'\t' read -r state target_url <<<"$line"
          test "$state" = success
          prefix="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/"
          case "$target_url" in "$prefix"*) ;; *) exit 77 ;; esac
          packages_run=${target_url#"$prefix"}
          [[ "$packages_run" =~ ^[0-9]+$ ]]
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$packages_run" \
            --jq '[.head_sha,.head_branch,.conclusion,.path] | @tsv')
          IFS=$'\t' read -r run_sha run_branch conclusion run_path <<<"$run"
          run_path=${run_path%%@*}
          test "$run_sha" = "$GITHUB_SHA"
          test "$run_branch" = main
          test "$conclusion" = success
          test "$run_path" = .github/workflows/packages.yml
          printf 'packages_run=%s\n' "$packages_run" >>"$GITHUB_OUTPUT"

  compare:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    container:
      image: ${{ matrix.builder_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_TERM_COLOR: always
      PACKAGES_RUN: ${{ needs.prepare.outputs.packages_run }}
      TARGET_ID: ${{ matrix.id }}
    steps:
      - name: Restore host workspace ownership before checkout
        shell: bash
        run: chown -R --reference="$GITHUB_WORKSPACE/.." "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify immutable native builder
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 tools/package-targets.py validate
          sh tools/verify-package-builder.sh "$TARGET_ID"
      - name: Download the exact release-candidate package artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          install -d candidate
          gh run download "$PACKAGES_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "vaultlink-package-$TARGET_ID" --dir candidate
      - name: Build package twice from clean target directories
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          [[ "$SOURCE_DATE_EPOCH" =~ ^[0-9]+$ ]]
          export SOURCE_DATE_EPOCH
          asset=$(python3 tools/package-targets.py asset "$TARGET_ID" "$version")
          test -s "candidate/$asset"
          test -s "candidate/$TARGET_ID.cdx.json"
          test "$(find candidate -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 2
          rm -rf target/repro-first target/repro-second repro
          install -d repro/first repro/second
          build_once() {
            label=$1
            cargo_target=$2
            output=$3
            CARGO_TARGET_DIR="$cargo_target" cargo build --locked --release
            rm -f ./*.cdx.json
            cargo cyclonedx --format json
            raw_sbom=$(find . -maxdepth 1 -name '*.cdx.json' -type f -print)
            test "$(printf '%s\n' "$raw_sbom" | grep -c .)" -eq 1
            python3 tools/normalize-cyclonedx-sbom.py \
              "$raw_sbom" "$output/$TARGET_ID.cdx.json"
            rm -f "$raw_sbom"
            cp "$cargo_target/release/vaultlink" "$output/vaultlink"
            sh tools/build-native-package.sh \
              "$TARGET_ID" "$version" "$cargo_target/release/vaultlink" \
              "$output/$TARGET_ID.cdx.json" "$output"
            sh tools/verify-native-package.sh \
              "$TARGET_ID" "$version" "$output/$asset" \
              "$cargo_target/release/vaultlink" "$output/$TARGET_ID.cdx.json"
            printf '%s\n' "$label complete"
          }
          build_once first target/repro-first repro/first
          rm -rf target/repro-first
          build_once second target/repro-second repro/second
          cmp repro/first/vaultlink repro/second/vaultlink
          cmp "repro/first/$TARGET_ID.cdx.json" "repro/second/$TARGET_ID.cdx.json"
          cmp "repro/first/$asset" "repro/second/$asset"
          cmp "candidate/$TARGET_ID.cdx.json" "repro/first/$TARGET_ID.cdx.json"
          cmp "candidate/$TARGET_ID.cdx.json" "repro/second/$TARGET_ID.cdx.json"
          cmp "candidate/$asset" "repro/first/$asset"
          cmp "candidate/$asset" "repro/second/$asset"
          sh tools/verify-native-package.sh \
            "$TARGET_ID" "$version" "candidate/$asset" \
            repro/first/vaultlink "candidate/$TARGET_ID.cdx.json"
          sh tools/lint-native-package.sh "$TARGET_ID" "repro/first/$asset"
          sha256sum \
            "candidate/$TARGET_ID.cdx.json" "candidate/$asset" \
            repro/first/vaultlink repro/second/vaultlink \
            "repro/first/$TARGET_ID.cdx.json" "repro/second/$TARGET_ID.cdx.json" \
            "repro/first/$asset" "repro/second/$asset" \
            >"repro/$TARGET_ID.sha256"
          printf 'target=%s\nversion=%s\ncommit=%s\npackages_run=%s\nbuilder_image=%s\nsource_date_epoch=%s\n' \
            "$TARGET_ID" "$version" "$GITHUB_SHA" "$PACKAGES_RUN" \
            '${{ matrix.builder_image }}' \
            "$SOURCE_DATE_EPOCH" >"repro/$TARGET_ID.env"
      - name: Upload comparison evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-reproducibility-${{ github.sha }}-${{ matrix.id }}
          path: |
            repro/${{ matrix.id }}.sha256
            repro/${{ matrix.id }}.env
          if-no-files-found: error
          retention-days: 30
      - name: Restore host workspace ownership
        if: always()
        shell: bash
        run: chown -R --reference="$GITHUB_WORKSPACE/.." "$GITHUB_WORKSPACE"

  publish_gate:
    name: Publish exact-commit package reproducibility gate
    if: always()
    needs: [prepare, compare]
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Record the package-run binding
        if: needs.prepare.result == 'success' && needs.compare.result == 'success'
        env:
          PACKAGES_RUN: ${{ needs.prepare.outputs.packages_run }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'commit=%s\npackages_run=%s\n' \
            "$GITHUB_SHA" "$PACKAGES_RUN" >reproducibility-binding.env
      - name: Upload the package-run binding
        if: needs.prepare.result == 'success' && needs.compare.result == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-reproducibility-binding-${{ github.sha }}
          path: reproducibility-binding.env
          if-no-files-found: error
          retention-days: 30
      - name: Publish aggregate result
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          COMPARE_RESULT: ${{ needs.compare.result }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PREPARE_RESULT" == success && "$COMPARE_RESULT" == success ]]; then
            state=success
            description='All nine package, binary, and SBOM double-build comparisons matched'
          else
            state=failure
            description='Package reproducibility matrix failed or locks are unprovisioned'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='vaultlink/package-reproducibility' \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
