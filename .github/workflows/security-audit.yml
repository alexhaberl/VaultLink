name: Security audit

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit
  cancel-in-progress: true

jobs:
  rustsec:
    name: RustSec advisories
    runs-on: [self-hosted, Linux, ARM64, vaultlink]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve pinned Rust toolchain
        id: rust_toolchain
        shell: bash
        run: echo "channel=$(sh tools/rust-toolchain-channel.sh)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
      - name: Install pinned cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.2
      - name: Audit workspace lockfile
        run: cargo audit --deny warnings --ignore RUSTSEC-2023-0071
