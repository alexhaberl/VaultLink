name: Publish VaultLink Docker image

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/alexhaberl/vaultlink
  BUILDKIT_IMAGE: docker.io/moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
  SBOM_SCANNER: docker.io/docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9

jobs:
  prepare:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      statuses: read
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      commit: ${{ steps.verify.outputs.commit }}
      version: ${{ steps.verify.outputs.version }}
      amd64_hash: ${{ steps.verify.outputs.amd64_hash }}
      arm64_hash: ${{ steps.verify.outputs.arm64_hash }}
      qualification_run: ${{ steps.verify.outputs.qualification_run }}
      qualification_attempt: ${{ steps.verify.outputs.qualification_attempt }}
      amd64_artifact_sha: ${{ steps.verify.outputs.amd64_artifact_sha }}
      arm64_artifact_sha: ${{ steps.verify.outputs.arm64_artifact_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Check published immutable release and verified tag
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=${TAG#v}
          python3 - "$version" <<'PY'
          import sys
          if tuple(map(int, sys.argv[1].split("."))) <= (0, 7, 1):
              raise SystemExit("published v0.7.1 and earlier have no Docker image")
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.draft')" = false
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.immutable')" = true
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)
          tag_record=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" \
            --jq '[.tag,.object.type,.object.sha,.verification.verified,.verification.reason] | @tsv')
          IFS=$'\t' read -r name kind target verified reason <<<"$tag_record"
          test "$name" = "$TAG"
          test "$kind" = commit
          test "$target" = "$COMMIT"
          test "$verified" = true
          test "$reason" = valid
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$COMMIT"
          test "$(git rev-parse HEAD)" = "$COMMIT"
          python3 tools/release-evidence.py docker --commit "$COMMIT" \
            --version "$version" --output docker-qualification.json
          amd64_hash=$(jq -r '.architectures.amd64.binary_sha256' docker-qualification.json)
          arm64_hash=$(jq -r '.architectures.arm64.binary_sha256' docker-qualification.json)
          qualification_run=$(jq -r '.run_id' docker-qualification.json)
          qualification_attempt=$(jq -r '.run_attempt' docker-qualification.json)
          amd64_artifact_sha=$(jq -r '.architectures.amd64.artifact_sha256' docker-qualification.json)
          arm64_artifact_sha=$(jq -r '.architectures.arm64.artifact_sha256' docker-qualification.json)
          printf 'tag=%s\ncommit=%s\nversion=%s\namd64_hash=%s\narm64_hash=%s\nqualification_run=%s\nqualification_attempt=%s\namd64_artifact_sha=%s\narm64_artifact_sha=%s\n' \
            "$TAG" "$COMMIT" "$version" "$amd64_hash" "$arm64_hash" \
            "$qualification_run" "$qualification_attempt" \
            "$amd64_artifact_sha" "$arm64_artifact_sha" >>"$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            uname: x86_64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            uname: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - name: Verify source and authenticate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ needs.prepare.outputs.commit }}'
          test "$(uname -m)" = '${{ matrix.uname }}'
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)" = '${{ needs.prepare.outputs.version }}'
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push native child manifest by digest
        shell: bash
        run: |
          set -euo pipefail
          builder="vaultlink-docker-${{ matrix.architecture }}"
          docker buildx create --driver docker-container \
            --driver-opt "image=$BUILDKIT_IMAGE" --name "$builder" --use
          trap 'docker buildx rm "$builder" >/dev/null 2>&1 || true' EXIT
          docker buildx inspect --bootstrap
          docker buildx build \
            --platform 'linux/${{ matrix.architecture }}' \
            --file deploy/docker/Dockerfile.runtime \
            --build-arg 'VERSION=${{ needs.prepare.outputs.version }}' \
            --build-arg 'VCS_REF=${{ needs.prepare.outputs.commit }}' \
            --metadata-file build-metadata.json \
            --provenance=mode=max --sbom="generator=$SBOM_SCANNER" \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" .
          digest=$(jq -r '."containerimage.digest" // empty' build-metadata.json)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          expected='${{ matrix.architecture == 'amd64' && needs.prepare.outputs.amd64_hash || needs.prepare.outputs.arm64_hash }}'
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          docker pull "$IMAGE@$digest"
          container=$(docker create "$IMAGE@$digest")
          docker cp "$container:/usr/local/bin/vaultlink" published-vaultlink
          docker rm "$container"
          measured=$(sha256sum published-vaultlink | cut -d ' ' -f 1)
          test "$measured" = "$expected"
          printf '%s\n' "$digest" >'digest-${{ matrix.architecture }}'
          printf '%s\n' "$measured" >'binary-${{ matrix.architecture }}.sha256'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-release-digest-${{ matrix.architecture }}
          path: |
            digest-${{ matrix.architecture }}
            binary-${{ matrix.architecture }}.sha256
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: docker-release-digest-*
          path: digests
          merge-multiple: true
      - name: Assemble and verify versioned multiarch image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          amd64=$(cat digests/digest-amd64)
          arm64=$(cat digests/digest-arm64)
          [[ "$amd64" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(cat digests/binary-amd64.sha256)" = '${{ needs.prepare.outputs.amd64_hash }}'
          test "$(cat digests/binary-arm64.sha256)" = '${{ needs.prepare.outputs.arm64_hash }}'
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tag="$IMAGE:${{ needs.prepare.outputs.tag }}"
          existing_tag=false
          if docker buildx imagetools inspect "$tag" >tag-inspection.txt 2>tag-inspection.err; then
            existing_tag=true
            echo "Versioned GHCR image exists; verifying its immutable digest without replacing it"
          else
            grep -Eiq 'manifest unknown|not found|name unknown' tag-inspection.err || {
              cat tag-inspection.err >&2
              echo "Could not prove the versioned tag is absent" >&2
              exit 1
            }
            docker buildx imagetools create --tag "$tag" "$IMAGE@$amd64" "$IMAGE@$arm64"
          fi
          docker buildx imagetools inspect "$tag" --raw >index.json
          jq -r '.manifests[].platform | select(.os == "linux") | "\(.os)/\(.architecture)"' index.json \
            | sort -u >platforms.actual
          printf '%s\n' linux/amd64 linux/arm64 >platforms.expected
          cmp platforms.expected platforms.actual
          index_amd64=$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' index.json)
          index_arm64=$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' index.json)
          [[ "$index_amd64" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$index_arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [ "$existing_tag" = false ]; then
            test "$index_amd64" = "$amd64"
            test "$index_arm64" = "$arm64"
          fi
          amd64=$index_amd64
          arm64=$index_arm64
          inspection=$(docker buildx imagetools inspect "$tag")
          printf '%s\n' "$inspection"
          index_digest=$(printf '%s\n' "$inspection" \
            | sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)
          [[ "$index_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s@%s\n' "$IMAGE" "$index_digest" >image-reference.txt
          printf 'tag=%s\ncommit=%s\namd64=%s\narm64=%s\n' \
            '${{ needs.prepare.outputs.tag }}' '${{ needs.prepare.outputs.commit }}' \
            "$amd64" "$arm64" >>image-reference.txt
          printf 'qualified_amd64_sha256=%s\nqualified_arm64_sha256=%s\nqualification_run=%s\nqualification_attempt=%s\nqualified_amd64_artifact_sha256=%s\nqualified_arm64_artifact_sha256=%s\n' \
            '${{ needs.prepare.outputs.amd64_hash }}' \
            '${{ needs.prepare.outputs.arm64_hash }}' \
            '${{ needs.prepare.outputs.qualification_run }}' \
            '${{ needs.prepare.outputs.qualification_attempt }}' \
            '${{ needs.prepare.outputs.amd64_artifact_sha }}' \
            '${{ needs.prepare.outputs.arm64_artifact_sha }}' >>image-reference.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-release-index-${{ needs.prepare.outputs.tag }}
          path: |
            image-reference.txt
            platforms.actual
          if-no-files-found: error
          retention-days: 90

  verify_public:
    needs: [prepare, publish]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            uname: x86_64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            uname: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-release-index-${{ needs.prepare.outputs.tag }}
      - name: Pull and inspect released image without credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = '${{ matrix.uname }}'
          test "$(git rev-parse HEAD)" = '${{ needs.prepare.outputs.commit }}'
          reference=$(head -n 1 image-reference.txt)
          [[ "$reference" =~ ^ghcr\.io/alexhaberl/vaultlink@sha256:[0-9a-f]{64}$ ]]
          docker_config=$(mktemp -d)
          trap 'rm -rf -- "$docker_config"' EXIT
          export DOCKER_CONFIG="$docker_config"
          docker pull --platform 'linux/${{ matrix.architecture }}' "$reference"
          expected='${{ matrix.architecture == 'amd64' && needs.prepare.outputs.amd64_hash || needs.prepare.outputs.arm64_hash }}'
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          grep -Fxq "qualified_${{ matrix.architecture }}_sha256=$expected" image-reference.txt
          container=$(docker create --platform 'linux/${{ matrix.architecture }}' "$reference")
          docker cp "$container:/usr/local/bin/vaultlink" verified-public-vaultlink
          docker rm "$container"
          measured=$(sha256sum verified-public-vaultlink | cut -d ' ' -f 1)
          test "$measured" = "$expected"
          child=$(sed -n 's/^${{ matrix.architecture }}=//p' image-reference.txt)
          [[ "$child" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'reference=%s\narchitecture=%s\nchild_digest=%s\nqualified_sha256=%s\npublic_sha256=%s\n' \
            "$reference" '${{ matrix.architecture }}' "$child" "$expected" "$measured" \
            >'public-binary-${{ matrix.architecture }}.txt'
          version=$(docker run --rm --network none \
            --entrypoint /usr/local/bin/vaultlink "$reference" --version)
          [[ "$version" == *'${{ needs.prepare.outputs.version }}'* ]]
          docker image inspect "$reference" \
            --format '{{.Architecture}} {{index .Config.Labels "org.opencontainers.image.revision"}}' \
            | grep -Fxq '${{ matrix.architecture }} ${{ needs.prepare.outputs.commit }}'
          docker tag "$reference" vaultlink:release-test
          VAULTLINK_TEST_IMAGE=vaultlink:release-test python3 tools/docker-runtime-smoke.py
          VAULTLINK_TEST_IMAGE=vaultlink:release-test bash tools/docker-rootless-smoke.sh
          VAULTLINK_TEST_IMAGE=vaultlink:release-test \
          VAULTLINK_TEST_ARCH='${{ matrix.architecture }}' bash tools/kubernetes-runtime-smoke.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-public-binary-${{ matrix.architecture }}-${{ needs.prepare.outputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-binary-${{ matrix.architecture }}.txt
          if-no-files-found: error
          retention-days: 90

  complete_evidence:
    needs: [prepare, publish, verify_public]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-release-index-${{ needs.prepare.outputs.tag }}
          path: evidence
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: docker-public-binary-*-${{ needs.prepare.outputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
          merge-multiple: true
      - name: Bind qualification, child digests and public binaries
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
          EXPECTED_TAG: ${{ needs.prepare.outputs.tag }}
          QUALIFICATION_RUN: ${{ needs.prepare.outputs.qualification_run }}
          QUALIFICATION_ATTEMPT: ${{ needs.prepare.outputs.qualification_attempt }}
          AMD64_HASH: ${{ needs.prepare.outputs.amd64_hash }}
          ARM64_HASH: ${{ needs.prepare.outputs.arm64_hash }}
          AMD64_ARTIFACT_SHA: ${{ needs.prepare.outputs.amd64_artifact_sha }}
          ARM64_ARTIFACT_SHA: ${{ needs.prepare.outputs.arm64_artifact_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          python3 tools/docker-release-proof.py \
            --evidence evidence --repository "$GITHUB_REPOSITORY" \
            --commit "$EXPECTED_COMMIT" --tag "$EXPECTED_TAG" \
            --qualification-run "$QUALIFICATION_RUN" \
            --qualification-attempt "$QUALIFICATION_ATTEMPT" \
            --amd64-hash "$AMD64_HASH" --arm64-hash "$ARM64_HASH" \
            --amd64-artifact-sha "$AMD64_ARTIFACT_SHA" \
            --arm64-artifact-sha "$ARM64_ARTIFACT_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-release-proof-${{ needs.prepare.outputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/docker-release-proof.json
          if-no-files-found: error
          retention-days: 90
