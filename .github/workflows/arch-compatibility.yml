name: Weekly Arch rolling compatibility

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vaultlink-arch-rolling-compatibility
  cancel-in-progress: true

jobs:
  current:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the latest supported public package release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_VISIBILITY: ${{ github.repository_visibility }}
        run: |
          set -euo pipefail
          if [[ "$REPOSITORY_VISIBILITY" != public ]]; then
            printf 'available=false\n' >>"$GITHUB_OUTPUT"
            printf 'Repository is not public; no supported public package release is available.\n' \
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [[ -z "$tag" ]]; then
            printf 'available=false\n' >>"$GITHUB_OUTPUT"
            printf 'No supported public VaultLink package release exists yet; compatibility check skipped.\n' \
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            printf 'available=false\n' >>"$GITHUB_OUTPUT"
            printf 'Latest release is not a supported stable native-package release; check skipped.\n' \
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          version=${tag#v}
          if ! python3 - "$version" <<'PY'
          import sys
          version = tuple(int(part) for part in sys.argv[1].split("."))
          if version < (0, 6, 0):
              raise SystemExit("latest release predates supported native packages")
          PY
          then
            printf 'available=false\n' >>"$GITHUB_OUTPUT"
            printf 'No supported native-package release exists yet; check skipped.\n' \
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          asset=$(python3 tools/package-targets.py asset \
            archlinux-amd64 "$version" --allow-unprovisioned)
          printf 'available=true\ntag=%s\nversion=%s\nasset=%s\n' \
            "$tag" "$version" "$asset" >>"$GITHUB_OUTPUT"
      - name: Download signed Arch release inputs
        if: steps.release.outputs.available == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail
          install -d -m 0755 arch-release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir arch-release \
            --pattern "$ASSET" \
            --pattern "$ASSET.minisig" \
            --pattern SHA256SUMS \
            --pattern SHA256SUMS.minisig
          test "$(find arch-release -maxdepth 1 -type f | wc -l)" -eq 4
      - name: Exercise current rolling userspace
        if: steps.release.outputs.available == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail
          docker pull archlinux:base
          digest=$(docker image inspect archlinux:base \
            --format '{{index .RepoDigests 0}}')
          [[ "$digest" =~ @sha256:[0-9a-f]{64}$ ]]
          printf '## Arch rolling image\n\n`%s`\n' "$digest" >>"$GITHUB_STEP_SUMMARY"
          docker run --rm --user root \
            --env ASSET --env VERSION \
            --volume "$PWD:/work:ro" --workdir /work "$digest" sh -c '
              set -eu
              pacman -Syu --noconfirm --needed \
                ca-certificates coreutils curl libarchive minisign sqlite systemd \
                tar util-linux zstd
              minisign -V -q -p release/minisign.pub \
                -m arch-release/SHA256SUMS \
                -x arch-release/SHA256SUMS.minisig
              checksum=$(grep -F "  $ASSET" arch-release/SHA256SUMS)
              test "$(printf "%s\n" "$checksum" | grep -c .)" -eq 1
              (cd arch-release && printf "%s\n" "$checksum" | sha256sum -c -)
              minisign -V -q -p release/minisign.pub \
                -m "arch-release/$ASSET" \
                -x "arch-release/$ASSET.minisig"
              install -o root -g root -m 0600 \
                "arch-release/$ASSET" "/var/tmp/$ASSET"
              bsdtar -xOf "/var/tmp/$ASSET" \
                usr/lib/vaultlink/package/deploy/vaultlink-package-install.sh \
                >/var/tmp/vaultlink-package-install.sh
              chown root:root /var/tmp/vaultlink-package-install.sh
              chmod 0700 /var/tmp/vaultlink-package-install.sh
              /var/tmp/vaultlink-package-install.sh "/var/tmp/$ASSET"
              test "$(/opt/vaultlink/vaultlink --version)" = "$VERSION"
              test "$(cat /usr/share/vaultlink/install-method.env | wc -l)" -eq 5
              ! systemctl --quiet is-enabled vaultlink.service
              ! systemctl --quiet is-enabled vaultlink-update.timer
            '
