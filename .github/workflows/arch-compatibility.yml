name: Weekly Arch rolling compatibility

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vaultlink-arch-rolling-compatibility
  cancel-in-progress: true

jobs:
  current:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the supported public package release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_VISIBILITY: ${{ github.repository_visibility }}
        run: |
          set -euo pipefail
          python3 tools/check-release-state.py
          if [[ "$REPOSITORY_VISIBILITY" != public ]]; then
            printf 'available=false\n' >>"$GITHUB_OUTPUT"
            printf 'Repository is not public; no supported public package release is available.\n' \
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          version=$(python3 tools/check-release-state.py --print-supported-version)
          tag="v$version"
          python3 tools/verify-supported-release.py --repository "$GITHUB_REPOSITORY"
          asset=$(python3 tools/package-targets.py asset \
            archlinux-amd64 "$version" --allow-unprovisioned)
          printf 'available=true\ntag=%s\nversion=%s\nasset=%s\n' \
            "$tag" "$version" "$asset" >>"$GITHUB_OUTPUT"
      - name: Download signed Arch release inputs
        if: steps.release.outputs.available == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail
          install -d -m 0755 arch-release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir arch-release \
            --pattern "$ASSET" \
            --pattern "$ASSET.minisig" \
            --pattern SHA256SUMS \
            --pattern SHA256SUMS.minisig
          test "$(find arch-release -maxdepth 1 -type f | wc -l)" -eq 4
      - name: Exercise current rolling userspace
        if: steps.release.outputs.available == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail
          docker pull archlinux:base
          digest=$(docker image inspect archlinux:base \
            --format "{{index .RepoDigests 0}}")
          [[ "$digest" =~ @sha256:[0-9a-f]{64}$ ]]
          printf "## Arch rolling image\n\n\`%s\`\n" "$digest" >>"$GITHUB_STEP_SUMMARY"
          docker run --rm --user root \
            --env ASSET --env VERSION \
            --volume "$PWD:/work:ro" --workdir /work "$digest" \
            sh tools/arch-rolling-compatibility.sh
