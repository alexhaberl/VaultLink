name: Docker runtime image gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILDKIT_IMAGE: docker.io/moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

concurrency:
  group: docker-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rootless_probe:
    name: Rootless runner probe (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify unprivileged daemon and container execution
        shell: bash
        env:
          VAULTLINK_PROBE_ONLY: '1'
        run: bash tools/docker-rootless-smoke.sh

  qualify:
    name: Docker runtime (${{ matrix.architecture }})
    needs: rootless_probe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            uname: x86_64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            uname: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test the native production image
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          PLATFORM: ${{ matrix.platform }}
          EXPECTED_UNAME: ${{ matrix.uname }}
        run: |
          set -euo pipefail
          mkdir -p "evidence/$ARCHITECTURE"
          printf 'state=failure\n' >"evidence/$ARCHITECTURE.env"
          test "$(uname -m)" = "$EXPECTED_UNAME"
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          builder="vaultlink-qualification-$ARCHITECTURE"
          docker buildx create --driver docker-container \
            --driver-opt "image=$BUILDKIT_IMAGE" --name "$builder" --use
          trap 'docker buildx rm "$builder" >/dev/null 2>&1 || true' EXIT
          docker buildx inspect --bootstrap
          for attempt in 1 2; do
            docker buildx build --no-cache --load \
              --platform "$PLATFORM" \
              --file deploy/docker/Dockerfile.runtime \
              --tag "vaultlink:runtime-$attempt" \
              --build-arg "VERSION=$version" \
              --build-arg "VCS_REF=$GITHUB_SHA" .
            container=$(docker create "vaultlink:runtime-$attempt")
            docker cp "$container:/usr/local/bin/vaultlink" "evidence/$ARCHITECTURE/vaultlink-$attempt"
            docker rm "$container"
            sha256sum "evidence/$ARCHITECTURE/vaultlink-$attempt" | cut -d ' ' -f 1 \
              >"evidence/$ARCHITECTURE/binary-$attempt.sha256"
          done
          cmp "evidence/$ARCHITECTURE/binary-1.sha256" "evidence/$ARCHITECTURE/binary-2.sha256"
          docker image inspect vaultlink:runtime-2 \
            --format '{{.Architecture}} {{.Config.User}} {{index .Config.Labels "org.opencontainers.image.revision"}}' \
            >"evidence/$ARCHITECTURE/image.txt"
          grep -Fxq "$ARCHITECTURE 10001:10001 $GITHUB_SHA" "evidence/$ARCHITECTURE/image.txt"
          docker run --rm --entrypoint sh vaultlink:runtime-2 -ec \
            '! command -v cargo && ! command -v rustc && \
             test -s /etc/ssl/certs/ca-certificates.crt && \
             test -s /usr/share/doc/vaultlink/LICENSE && \
             test -s /usr/share/doc/vaultlink/config/production-reverse-proxy.toml'
          VAULTLINK_IMAGE=vaultlink:runtime-2 \
          VAULTLINK_STATE_DIR="$RUNNER_TEMP/vaultlink-state" \
          VAULTLINK_STORAGE_DIR="$RUNNER_TEMP/vaultlink-storage" \
            docker compose -f deploy/docker/compose.yaml config --quiet
          VAULTLINK_TEST_IMAGE=vaultlink:runtime-2 python3 tools/docker-runtime-smoke.py
          VAULTLINK_TEST_IMAGE=vaultlink:runtime-2 \
          VAULTLINK_TEST_ARCH="$ARCHITECTURE" bash tools/kubernetes-runtime-smoke.sh \
            | tee "evidence/$ARCHITECTURE/kubernetes.txt"
          VAULTLINK_TEST_IMAGE=vaultlink:runtime-2 bash tools/docker-rootless-smoke.sh \
            | tee "evidence/$ARCHITECTURE/rootless.txt"
          cat "evidence/$ARCHITECTURE/binary-2.sha256" >>"evidence/$ARCHITECTURE/image.txt"
          printf 'state=success\n' >"evidence/$ARCHITECTURE.env"
          python3 - "$ARCHITECTURE" "$version" <<'PY' >qualification.json
          import json, os, pathlib, sys
          architecture, version = sys.argv[1:]
          digest = pathlib.Path(f"evidence/{architecture}/binary-1.sha256").read_text().strip()
          if len(digest) != 64 or any(c not in "0123456789abcdef" for c in digest):
              raise SystemExit("invalid qualified binary SHA-256")
          json.dump({"schema_version": 1, "repository": os.environ["GITHUB_REPOSITORY"],
                     "commit": os.environ["GITHUB_SHA"], "version": version,
                     "workflow": ".github/workflows/docker-runtime.yml",
                     "event": os.environ["GITHUB_EVENT_NAME"],
                     "architecture": architecture, "run_id": int(os.environ["GITHUB_RUN_ID"]),
                     "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                     "binary_sha256": digest}, sys.stdout, sort_keys=True)
          PY
      - name: Preserve successful qualification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-qualification-${{ matrix.architecture }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve Docker runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-${{ matrix.architecture }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 90

  publish_gate:
    name: Publish exact-commit Docker gates
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [qualify]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: docker-qualification-*-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Publish independent architecture results
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for architecture in amd64 arm64; do
            state=failure
            receipt="evidence/docker-qualification-$architecture-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/qualification.json"
            if [[ '${{ needs.qualify.result }}' == success && -f "$receipt" ]] && jq -e \
              --arg arch "$architecture" --arg sha "$GITHUB_SHA" \
              --arg repo "$GITHUB_REPOSITORY" --argjson run "$GITHUB_RUN_ID" \
              --argjson attempt "$GITHUB_RUN_ATTEMPT" \
              --arg version "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)" \
              '.schema_version == 1 and .architecture == $arch and .commit == $sha and
               .repository == $repo and .run_id == $run and .run_attempt == $attempt and
               .version == $version and .workflow == ".github/workflows/docker-runtime.yml" and
               (.event == "push" or .event == "workflow_dispatch") and
               (.binary_sha256 | test("^[0-9a-f]{64}$"))' "$receipt" >/dev/null; then
              state=success
            fi
            gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state="$state" \
              -f context="vaultlink/docker-$architecture" \
              -f description="Native image, rootless Docker and Kubernetes deployment: $state" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done
