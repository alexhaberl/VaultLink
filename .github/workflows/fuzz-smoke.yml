name: Fuzz smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fuzz-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Fuzz replay and smoke (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      # Smoke favors compile time; the 600-second campaign retains release LTO.
      CARGO_PROFILE_RELEASE_LTO: 'off'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      FUZZ_CODEGEN_UNITS: 16
      FUZZ_JOBS: ${{ github.repository_visibility == 'public' && '4' || '2' }}
      FUZZ_MAX_TOTAL_TIME: 30
      FUZZ_BUILD_TIMEOUT: 3600
      FUZZ_REPLAY_TIMEOUT: 120
      FUZZ_CMIN_TIMEOUT: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly-2026-07-01
          components: rust-src
      - name: Verify native architecture
        run: test "$(uname -m)" = x86_64
      - name: Cache smoke build dependencies and artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # Cache service failures must still allow the build and fuzz gates to run.
        continue-on-error: true
        timeout-minutes: 10
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Workspace builds live in target; corpus and credentials are excluded.
          key: fuzz-smoke-v1-${{ runner.os }}-${{ runner.arch }}-nightly-2026-07-01-cargo-fuzz-0.13.2-release-lto-off-cgu16-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'fuzz/Cargo.toml', '.cargo/config*') }}-${{ hashFiles('src/**', 'fuzz/fuzz_targets/**', 'templates/**', 'assets/**', '.github/workflows/fuzz-smoke.yml', 'tools/run-fuzz-targets.py', 'Makefile') }}
          restore-keys: |
            fuzz-smoke-v1-${{ runner.os }}-${{ runner.arch }}-nightly-2026-07-01-cargo-fuzz-0.13.2-release-lto-off-cgu16-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'fuzz/Cargo.toml', '.cargo/config*') }}-
      - name: Configure isolated corpus and evidence directories
        shell: bash
        run: |
          printf 'FUZZ_CORPUS_DIR=%s/vaultlink-fuzz-corpus\nFUZZ_LOG_DIR=%s/vaultlink-fuzz-logs\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install pinned cargo-fuzz
        run: cargo install --locked cargo-fuzz --version 0.13.2
      - name: Validate corpus tooling and workflow contracts
        run: |
          python3 tools/test-fuzz-corpus.py
          python3 tools/test-fuzz-policy.py
          python3 tools/generate-fuzz-seeds.py --check
          python3 tools/check-fuzz-policy.py
      - name: Restore current Git regression seeds
        run: python3 tools/fuzz-corpus.py restore --destination "$FUZZ_CORPUS_DIR" --seed-only
      - name: Replay every seed and fuzz all targets for 30 seconds
        run: make fuzz-parallel
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-smoke-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            fuzz/artifacts/
            ${{ runner.temp }}/vaultlink-fuzz-logs/
            ${{ runner.temp }}/vaultlink-fuzz-corpus/
          if-no-files-found: ignore
          retention-days: 30
