name: Collect 72-hour release soak

on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: vaultlink-release-soak-collector
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, vaultlink-soak]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read atomic host-side result
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/soak-evidence"
          sh tools/collect-soak-evidence.sh "$destination"
      - name: Verify successful evidence before publication
        id: verify
        if: ${{ always() && steps.collect.outcome == 'success' && steps.collect.outputs.state == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          sh tools/check-soak-evidence.sh \
            '${{ steps.collect.outputs.commit_sha }}' \
            '${{ steps.collect.outputs.evidence_dir }}'
      - name: Resolve collector state
        id: final
        if: ${{ always() && steps.collect.outputs.commit_sha != '' }}
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          COLLECTED_STATE: ${{ steps.collect.outputs.state }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          EVIDENCE_DIR: ${{ steps.collect.outputs.evidence_dir }}
        shell: bash
        run: |
          export LC_ALL=C LANG=C
          state="$COLLECTED_STATE"
          if [[ "$COLLECT_OUTCOME" != success ]]; then
            state=failure
          elif [[ "$state" == success && "$VERIFY_OUTCOME" != success ]]; then
            state=failure
            if [[ -n "$EVIDENCE_DIR" && -d "$EVIDENCE_DIR" ]]; then
              printf 'state=failure\nreason=collector_verification_failed\n' \
                >"$EVIDENCE_DIR/collector-verification-failure.env"
              (
                cd "$EVIDENCE_DIR"
                sha256sum ./collector-verification-failure.env >>SHA256SUMS
              )
            fi
          fi
          case "$state" in pending|success|failure) ;; *) state=failure ;; esac
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Upload terminal evidence
        id: artifact
        if: ${{ always() && steps.collect.outputs.evidence_dir != '' && (steps.final.outputs.state == 'success' || steps.final.outputs.state == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soak-evidence-${{ steps.collect.outputs.commit_sha }}
          path: ${{ steps.collect.outputs.evidence_dir }}
          if-no-files-found: error
          retention-days: 90
      - name: Publish exact-commit status
        if: ${{ always() && steps.collect.outputs.commit_sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.collect.outputs.commit_sha }}
          COLLECTED_STATE: ${{ steps.final.outputs.state }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$COLLECTED_STATE" != pending && "$ARTIFACT_OUTCOME" != success ]]; then
            COLLECTED_STATE=failure
          fi
          case "$COLLECTED_STATE" in
            pending) state=pending; description='Host-side 72-hour soak is running' ;;
            success) state=success; description='Exact-commit 72-hour soak passed' ;;
            failure) state=failure; description='Exact-commit 72-hour soak failed' ;;
            *) echo "unsupported collector state: $COLLECTED_STATE" >&2; exit 1 ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$COMMIT_SHA" \
            -f state="$state" \
            -f context='vaultlink/72h-soak' \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Fail collector job after publishing failure evidence
        if: ${{ always() && steps.collect.outputs.commit_sha != '' && (steps.final.outputs.state == 'failure' || (steps.final.outputs.state != 'pending' && steps.artifact.outcome != 'success')) }}
        run: exit 1
