name: Fuzz release gate

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz all targets
    runs-on: [self-hosted, Linux, ARM64, vaultlink]
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      FUZZ_JOBS: 4
      FUZZ_MAX_TOTAL_TIME: 600
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: nightly-2026-07-01
      - name: Install pinned cargo-fuzz
        run: cargo install --locked cargo-fuzz --version 0.13.2
      - name: Run all targets with four workers for 10 minutes each
        run: make fuzz-parallel
        env:
          FUZZ_LOG_DIR: ${{ runner.temp }}/vaultlink-fuzz-logs
      - name: Upload crash artifacts and logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ github.sha }}
          path: |
            fuzz/artifacts/
            ${{ runner.temp }}/vaultlink-fuzz-logs/
          if-no-files-found: ignore
          retention-days: 14
