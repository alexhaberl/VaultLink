name: Fuzz release gate

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz all targets (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runs_on: ubuntu-24.04
            expected_uname: x86_64
          - architecture: arm64
            runs_on: ubuntu-24.04-arm
            expected_uname: aarch64
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      # Instrumented ASan/coverage linkers can use several GiB each. Keep the
      # build fan-out independent from the four runtime fuzz workers below.
      CARGO_BUILD_JOBS: 2
      # Keep optimized fuzz throughput without repeating ThinLTO for every target.
      CARGO_PROFILE_RELEASE_LTO: 'off'
      FUZZ_CODEGEN_UNITS: 1
      # Private standard runners provide two cores and 8 GiB; public standard
      # runners provide four cores and 16 GiB. Keep one fuzzer per core.
      FUZZ_JOBS: ${{ github.repository_visibility == 'public' && '4' || '2' }}
      FUZZ_MAX_TOTAL_TIME: 900
      FUZZ_BUILD_TIMEOUT: 3600
      FUZZ_REPLAY_TIMEOUT: 120
      FUZZ_CMIN_TIMEOUT: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly-2026-07-01
          components: rust-src
      - name: Verify native architecture
        run: test "$(uname -m)" = "${{ matrix.expected_uname }}"
      - name: Configure isolated corpus and evidence directories
        shell: bash
        run: |
          printf 'FUZZ_CORPUS_DIR=%s/vaultlink-fuzz-corpus\nFUZZ_LOG_DIR=%s/vaultlink-fuzz-logs\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install pinned cargo-fuzz
        run: cargo install --locked cargo-fuzz --version 0.13.2
      - name: Restore validated main corpora and current Git seeds
        run: python3 tools/fuzz-corpus.py restore --destination "$FUZZ_CORPUS_DIR" --repository "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Replay, fuzz every target for 15 minutes, and minimize
        run: make fuzz-parallel
      - name: Prepare validated corpus snapshot
        run: >-
          python3 tools/fuzz-corpus.py snapshot
          --corpus "$FUZZ_CORPUS_DIR"
          --destination "${{ runner.temp }}/fuzz-corpus-snapshot"
          --architecture "${{ matrix.architecture }}"
          --logs "$FUZZ_LOG_DIR"
      - name: Save corpus for subsequent main campaigns
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-corpus-${{ matrix.architecture }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fuzz-corpus-snapshot/
          if-no-files-found: error
          retention-days: 90
      - name: Upload campaign evidence, including successful logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-evidence-${{ github.sha }}-${{ matrix.architecture }}-${{ github.run_attempt }}
          path: |
            fuzz/artifacts/
            ${{ runner.temp }}/vaultlink-fuzz-logs/
            ${{ runner.temp }}/vaultlink-fuzz-corpus/
          if-no-files-found: ignore
          retention-days: 30
      # Retain the existing status contexts consumed by release and soak. The
      # 900-second campaign exceeds their historical 600-second minimum.
      - name: Publish exact-commit native fuzz gate
        if: always()
        env:
          GATE_RESULT: ${{ job.status }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          case "$GATE_RESULT" in
            success) state=success; description='All targets passed the native 900-second fuzz campaign' ;;
            *) state=failure; description='The native 900-second fuzz campaign failed' ;;
          esac
          curl --fail-with-body --silent --show-error \
            --retry 5 \
            --retry-delay 2 \
            --retry-max-time 60 \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "{\"state\":\"$state\",\"context\":\"vaultlink/fuzz-600s-${{ matrix.architecture }}\",\"description\":\"$description\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
