name: Fuzz release gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.1
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz
      - name: Path normalization (10 minutes)
        run: cargo fuzz run path_normalization -- -max_total_time=600
      - name: Byte ranges (10 minutes)
        run: cargo fuzz run byte_range -- -max_total_time=600
      - name: Filenames (10 minutes)
        run: cargo fuzz run filename -- -max_total_time=600
