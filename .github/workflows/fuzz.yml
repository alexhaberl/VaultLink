name: Fuzz release gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-01
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz
      - name: Path normalization (10 minutes)
        run: cargo +nightly-2026-07-01 fuzz run path_normalization -- -max_total_time=600
      - name: Byte ranges (10 minutes)
        run: cargo +nightly-2026-07-01 fuzz run byte_range -- -max_total_time=600
      - name: Filenames (10 minutes)
        run: cargo +nightly-2026-07-01 fuzz run filename -- -max_total_time=600
      - name: ZIP search preview paths (10 minutes)
        run: cargo +nightly-2026-07-01 fuzz run zip_search_preview_paths -- -max_total_time=600
      - name: Upload overwrite policy (10 minutes)
        run: cargo +nightly-2026-07-01 fuzz run upload_overwrite_policy -- -max_total_time=600
      - name: Upload validation policy (10 minutes)
        run: cargo +nightly-2026-07-01 fuzz run upload_validation_policy -- -max_total_time=600
      - name: API request policy (10 minutes)
        run: cargo +nightly-2026-07-01 fuzz run api_request_policy -- -max_total_time=600
