name: Fuzz release gate

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz all targets (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runs_on: '["self-hosted", "Linux", "X64", "vaultlink"]'
            expected_uname: x86_64
          - architecture: arm64
            runs_on: '["self-hosted", "Linux", "ARM64", "vaultlink"]'
            expected_uname: aarch64
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      FUZZ_JOBS: 4
      FUZZ_MAX_TOTAL_TIME: 600
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: nightly-2026-07-01
      - name: Verify native architecture
        run: test "$(uname -m)" = "${{ matrix.expected_uname }}"
      - name: Install pinned cargo-fuzz
        run: cargo install --locked cargo-fuzz --version 0.13.2
      - name: Run all targets with four workers for 10 minutes each
        run: make fuzz-parallel
        env:
          FUZZ_LOG_DIR: ${{ runner.temp }}/vaultlink-fuzz-logs
      - name: Upload crash artifacts and logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ github.sha }}-${{ matrix.architecture }}
          path: |
            fuzz/artifacts/
            ${{ runner.temp }}/vaultlink-fuzz-logs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish exact-commit 600-second fuzz gate
        if: always()
        env:
          GATE_RESULT: ${{ job.status }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          case "$GATE_RESULT" in
            success) state=success; description='All targets passed the native 600-second fuzz gate' ;;
            *) state=failure; description='The native 600-second fuzz gate failed' ;;
          esac
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "{\"state\":\"$state\",\"context\":\"vaultlink/fuzz-600s-${{ matrix.architecture }}\",\"description\":\"$description\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
