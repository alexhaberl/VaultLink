name: Start 72-hour release soak

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact origin/main commit to exercise
        required: true
        type: string
      binary_sha256:
        description: Confirmation SHA-256 of the deployed candidate amd64 binary
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: read
  statuses: write

concurrency:
  group: vaultlink-release-soak
  cancel-in-progress: false

jobs:
  start:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release-soak
    timeout-minutes: 10
    container:
      image: ${{ vars.VAULTLINK_PACKAGE_SIGNING_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SOAK_TOOL_IMAGE: ${{ vars.VAULTLINK_PACKAGE_SIGNING_IMAGE }}
    steps:
      - name: Restore host workspace ownership before checkout
        shell: bash
        run: chown -R --reference="$GITHUB_WORKSPACE/.." "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact release candidate
        id: validate
        shell: bash
        env:
          APPROVED_COMMIT: ${{ inputs.commit_sha }}
          APPROVED_BINARY_SHA256: ${{ inputs.binary_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          [[ "$APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APPROVED_BINARY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$APPROVED_COMMIT"
          main_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$main_commit" = "$APPROVED_COMMIT"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)" = 0.6.0
          python3 tools/package-targets.py validate
          test "$SOAK_TOOL_IMAGE" = \
            "$(python3 tools/package-targets.py get debian13-amd64 builder_image)"
          sh tools/verify-package-builder.sh debian13-amd64
          sh tools/check-version-consistency.sh --release-candidate
          sh tools/check-supply-chain-policy.sh
          validate_gate() {
            context=$1
            workflow_path=$2
            expected_title=${3:-}
            expected_event=${4:-}
            status_lines=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/commits/$APPROVED_COMMIT/statuses?per_page=100" \
              --jq ".[] | select(.context == \"$context\") | [.state, .target_url] | @tsv")
            status_line=$(printf '%s\n' "$status_lines" | sed -n '1p')
            IFS=$'\t' read -r state target_url <<<"$status_line"
            test "$state" = success
            prefix="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/"
            case "$target_url" in "$prefix"*) ;; *) return 1 ;; esac
            run_id=${target_url#"$prefix"}
            [[ "$run_id" =~ ^[0-9]+$ ]]
            run_line=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
              --jq '[.head_sha, .head_branch, .conclusion, .path, .display_title, .event] | @tsv')
            IFS=$'\t' read -r run_sha run_branch conclusion run_path run_title run_event <<<"$run_line"
            run_path=${run_path%%@*}
            test "$run_sha" = "$APPROVED_COMMIT"
            test "$run_branch" = main
            test "$conclusion" = success
            test "$run_path" = "$workflow_path"
            if [[ -n "$expected_title" ]]; then
              test "$run_title" = "$expected_title"
            fi
            if [[ -n "$expected_event" ]]; then
              test "$run_event" = "$expected_event"
            fi
            VALIDATED_RUN_ID=$run_id
          }
          validate_gate vaultlink/native-amd64 .github/workflows/ci.yml
          validate_gate vaultlink/native-arm64 .github/workflows/ci.yml
          validate_gate vaultlink/fuzz-600s-amd64 .github/workflows/fuzz.yml
          validate_gate vaultlink/fuzz-600s-arm64 .github/workflows/fuzz.yml
          validate_gate vaultlink/packages .github/workflows/packages.yml
          validate_gate vaultlink/package-reproducibility .github/workflows/reproducibility.yml
          validate_gate vaultlink/distro-vms .github/workflows/distro-vms.yml \
            "Distro VMs $APPROVED_COMMIT" workflow_dispatch
          validate_gate vaultlink/release-dry-run .github/workflows/release.yml
          validate_gate vaultlink/release-candidate-preflight .github/workflows/release.yml \
            "Release candidate $APPROVED_COMMIT" workflow_dispatch
          candidate_run=$VALIDATED_RUN_ID
          candidate_artifact="$RUNNER_TEMP/release-candidate-packages"
          test ! -e "$candidate_artifact"
          gh run download "$candidate_run" \
            --repo "$GITHUB_REPOSITORY" \
            --name "vaultlink-release-unsigned-$APPROVED_COMMIT" \
            --dir "$candidate_artifact"
          sh tools/verify-package-release.sh "$candidate_artifact" 0.6.0
          test "$(find "$candidate_artifact" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 11
          deb=$(python3 tools/package-targets.py asset debian13-amd64 0.6.0)
          extracted="$RUNNER_TEMP/release-candidate-deb"
          test ! -e "$extracted"
          dpkg-deb -x "$candidate_artifact/$deb" "$extracted"
          candidate_binary="$extracted/usr/lib/vaultlink/package/vaultlink"
          test -s "$candidate_binary"
          candidate_binary_sha256=$(sha256sum "$candidate_binary" | awk '{print $1}')
          test "$candidate_binary_sha256" = "$APPROVED_BINARY_SHA256"
          echo "binary_sha256=$candidate_binary_sha256" >> "$GITHUB_OUTPUT"
      - name: Configure pinned soak-host SSH transport
        id: ssh
        shell: bash
        env:
          SOAK_SSH_HOST: ${{ secrets.SOAK_SSH_HOST }}
          SOAK_SSH_PORT: ${{ secrets.SOAK_SSH_PORT }}
          SOAK_SSH_USER: ${{ secrets.SOAK_SSH_USER }}
          SOAK_SSH_PRIVATE_KEY: ${{ secrets.SOAK_SSH_PRIVATE_KEY }}
          SOAK_SSH_HOST_KEYS: ${{ secrets.SOAK_SSH_HOST_KEYS }}
        run: sh tools/configure-soak-ssh.sh
      - name: Start host-side systemd monitor
        env:
          APPROVED_COMMIT: ${{ inputs.commit_sha }}
          APPROVED_BINARY_SHA256: ${{ steps.validate.outputs.binary_sha256 }}
          SSH_CONFIG: ${{ steps.ssh.outputs.config }}
        run: |
          set -euo pipefail
          orchestration_sha256=$(
            for file in \
              deploy/vaultlink-soak-control.sh \
              deploy/vaultlink-soak-remote.sh \
              tools/soak-monitor.sh \
              tools/load-test.sh \
              tools/collect-soak-evidence.sh \
              deploy/vaultlink-soak@.service; do
              sha256sum "$file" | awk '{print $1}'
            done | sha256sum | awk '{print $1}'
          )
          ssh -F "$SSH_CONFIG" vaultlink-soak \
            start "$APPROVED_COMMIT" "$APPROVED_BINARY_SHA256" "$orchestration_sha256"
      - name: Publish pending commit status
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_COMMIT: ${{ inputs.commit_sha }}
        shell: bash
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$APPROVED_COMMIT" \
            -f state=pending \
            -f context='vaultlink/72h-soak' \
            -f description='Host-side 72-hour soak is running' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Restore host workspace ownership
        if: always()
        shell: bash
        run: chown -R --reference="$GITHUB_WORKSPACE/.." "$GITHUB_WORKSPACE"
