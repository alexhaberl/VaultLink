name: Release
run-name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.preflight_mode || 'tag' }} ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      preflight_mode:
        description: Release validation level for an untagged main commit
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - candidate
          - evidence
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read
  packages: read
  statuses: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve exact package release inputs
    runs-on: ubuntu-24.04
    outputs:
      candidate_commit: ${{ steps.release.outputs.candidate_commit }}
      package_version: ${{ steps.release.outputs.package_version }}
      packages_run: ${{ steps.release.outputs.packages_run }}
      signing_image: ${{ steps.release.outputs.signing_image }}
      release_stage: ${{ steps.release.outputs.release_stage }}
      soak_binary_sha256: ${{ steps.release.outputs.soak_binary_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version, package locks, and exact-commit gates
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_MODE: ${{ inputs.preflight_mode || 'tag' }}
          REPOSITORY_VISIBILITY: ${{ github.repository_visibility }}
        run: |
          set -euo pipefail
          package_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 tools/package-targets.py validate
          signing_image=$(python3 tools/package-targets.py get debian13-amd64 builder_image)
          candidate_commit=$GITHUB_SHA
          release_stage=$PREFLIGHT_MODE
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            release_stage=tag
            test "$REPOSITORY_VISIBILITY" = public
            test "$GITHUB_REF_NAME" = "v$package_version"
            test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
            candidate_commit=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
            main_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            test "$candidate_commit" = "$main_commit"
            sh tools/check-version-consistency.sh --release-candidate
          else
            test "$GITHUB_REF" = refs/heads/main
            test "$(git rev-parse HEAD)" = "$candidate_commit"
            main_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            test "$candidate_commit" = "$main_commit"
            case "$release_stage" in
              dry-run) sh tools/check-version-consistency.sh ;;
              candidate | evidence) sh tools/check-version-consistency.sh --release-candidate ;;
              *) exit 64 ;;
            esac
          fi

          validate_gate() {
            context=$1
            workflow_path=$2
            expected_title=${3:-}
            expected_event=${4:-}
            lines=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/commits/$candidate_commit/statuses?per_page=100" \
              --jq ".[] | select(.context == \"$context\") | [.state,.target_url] | @tsv")
            line=$(printf '%s\n' "$lines" | sed -n '1p')
            test -n "$line"
            IFS=$'\t' read -r state target_url <<<"$line"
            test "$state" = success
            prefix="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/"
            case "$target_url" in "$prefix"*) ;; *) exit 77 ;; esac
            run_id=${target_url#"$prefix"}
            [[ "$run_id" =~ ^[0-9]+$ ]]
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
              --jq '[.head_sha,.head_branch,.conclusion,.path,.display_title,.event] | @tsv')
            IFS=$'\t' read -r run_sha run_branch conclusion run_path run_title run_event <<<"$run"
            run_path=${run_path%%@*}
            test "$run_sha" = "$candidate_commit"
            test "$run_branch" = main
            test "$conclusion" = success
            test "$run_path" = "$workflow_path"
            if [[ -n "$expected_title" ]]; then test "$run_title" = "$expected_title"; fi
            if [[ -n "$expected_event" ]]; then test "$run_event" = "$expected_event"; fi
            VALIDATED_RUN_ID=$run_id
          }

          validate_gate vaultlink/native-amd64 .github/workflows/ci.yml
          validate_gate vaultlink/native-arm64 .github/workflows/ci.yml
          validate_gate vaultlink/fuzz-600s-amd64 .github/workflows/fuzz.yml
          validate_gate vaultlink/fuzz-600s-arm64 .github/workflows/fuzz.yml
          validate_gate vaultlink/packages .github/workflows/packages.yml
          packages_run=$VALIDATED_RUN_ID

          if [[ "$release_stage" != dry-run ]]; then
            validate_gate vaultlink/release-dry-run .github/workflows/release.yml
            validate_gate vaultlink/package-reproducibility .github/workflows/reproducibility.yml
            reproducibility_run=$VALIDATED_RUN_ID
            binding_dir=$(mktemp -d)
            gh run download "$reproducibility_run" --repo "$GITHUB_REPOSITORY" \
              --name "package-reproducibility-binding-$candidate_commit" \
              --dir "$binding_dir"
            printf 'commit=%s\npackages_run=%s\n' \
              "$candidate_commit" "$packages_run" >"$binding_dir/expected.env"
            cmp "$binding_dir/expected.env" "$binding_dir/reproducibility-binding.env"
            validate_gate vaultlink/distro-vms .github/workflows/distro-vms.yml \
              "Distro VMs $candidate_commit" workflow_dispatch
            distro_vm_run=$VALIDATED_RUN_ID
            vm_binding_dir=$(mktemp -d)
            gh run download "$distro_vm_run" --repo "$GITHUB_REPOSITORY" \
              --name "distro-vm-binding-$candidate_commit" \
              --dir "$vm_binding_dir"
            cmp "$binding_dir/expected.env" "$vm_binding_dir/distro-vm-binding.env"
          fi
          if [[ "$release_stage" == evidence || "$release_stage" == tag ]]; then
            validate_gate vaultlink/release-candidate-preflight .github/workflows/release.yml \
              "Release candidate $candidate_commit" workflow_dispatch
            validate_gate vaultlink/performance .github/workflows/performance-evidence.yml "" workflow_dispatch
            validate_gate vaultlink/72h-soak .github/workflows/soak-collect.yml
            soak_run=$VALIDATED_RUN_ID
            soak_dir=$(mktemp -d)
            gh run download "$soak_run" --repo "$GITHUB_REPOSITORY" \
              --name "soak-evidence-$candidate_commit" --dir "$soak_dir"
            soak_output=$(sh tools/check-soak-evidence.sh "$candidate_commit" "$soak_dir")
            soak_binary_sha256=$(printf '%s\n' "$soak_output" \
              | sed -n 's/^binary_sha256=//p')
            [[ "$soak_binary_sha256" =~ ^[0-9a-f]{64}$ ]]
          else
            soak_binary_sha256=not-required
          fi
          if [[ "$release_stage" == tag ]]; then
            validate_gate vaultlink/release-evidence-preflight .github/workflows/release.yml \
              "Release evidence $candidate_commit" workflow_dispatch
          fi

          printf '%s\n' \
            "candidate_commit=$candidate_commit" \
            "package_version=$package_version" \
            "packages_run=$packages_run" \
            "signing_image=$signing_image" \
            "release_stage=$release_stage" \
            "soak_binary_sha256=$soak_binary_sha256" \
            >>"$GITHUB_OUTPUT"

  assemble:
    name: Assemble and verify unsigned package release
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ${{ needs.prepare.outputs.signing_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Restore host workspace ownership before checkout
        shell: bash
        run: chown -R --reference="$GITHUB_WORKSPACE/.." "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate_commit }}
          persist-credentials: false
      - name: Verify protected package-builder selection
        shell: bash
        env:
          EXPECTED_IMAGE: ${{ needs.prepare.outputs.signing_image }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 tools/package-targets.py validate
          test "$EXPECTED_IMAGE" = "$(python3 tools/package-targets.py get debian13-amd64 builder_image)"
          sh tools/verify-package-builder.sh debian13-amd64
      - name: Download the exact nine package artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGES_RUN: ${{ needs.prepare.outputs.packages_run }}
        run: |
          set -euo pipefail
          install -d -m 0755 package-input
          while IFS=$'\t' read -r target asset; do
            gh run download "$PACKAGES_RUN" --repo "$GITHUB_REPOSITORY" \
              --name "vaultlink-package-$target" --dir package-input
            test -s "package-input/$asset"
            test -s "package-input/$target.cdx.json"
          done < <(python3 tools/package-targets.py records '${{ needs.prepare.outputs.package_version }}')
          test "$(find package-input -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 18
      - name: Assemble deterministic unsigned asset set
        shell: bash
        run: |
          set -euo pipefail
          sh tools/assemble-package-release.sh \
            package-input dist '${{ needs.prepare.outputs.package_version }}'
          sh tools/verify-package-release.sh \
            dist '${{ needs.prepare.outputs.package_version }}'
          test "$(find dist -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 11
      - name: Bind Debian soak evidence to the final DEB payload
        if: needs.prepare.outputs.soak_binary_sha256 != 'not-required'
        shell: bash
        env:
          SOAK_BINARY_SHA256: ${{ needs.prepare.outputs.soak_binary_sha256 }}
        run: |
          set -euo pipefail
          deb=$(python3 tools/package-targets.py asset \
            debian13-amd64 '${{ needs.prepare.outputs.package_version }}')
          root=$(mktemp -d)
          trap 'rm -rf "$root"' EXIT
          dpkg-deb -x "dist/$deb" "$root"
          test "$(sha256sum "$root/usr/lib/vaultlink/package/vaultlink" | awk '{print $1}')" \
            = "$SOAK_BINARY_SHA256"
      - name: Verify final performance, soak, and qualification against the extracted binary
        if: needs.prepare.outputs.release_stage == 'evidence' || needs.prepare.outputs.release_stage == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ needs.prepare.outputs.candidate_commit }}
          PACKAGES_RUN: ${{ needs.prepare.outputs.packages_run }}
          RELEASE_STAGE: ${{ needs.prepare.outputs.release_stage }}
        run: |
          set -euo pipefail
          deb=$(python3 tools/package-targets.py asset debian13-amd64 '${{ needs.prepare.outputs.package_version }}')
          extracted=$(mktemp -d)
          trap 'rm -rf "$extracted"' EXIT
          dpkg-deb -x "dist/$deb" "$extracted"
          binary="$extracted/usr/lib/vaultlink/package/vaultlink"
          binary_sha256=$(sha256sum "$binary" | awk '{print $1}')
          receipt="$RUNNER_TEMP/performance-receipt.json"
          python3 tools/release-evidence.py performance --commit "$CANDIDATE_COMMIT" \
            --binary-sha256 "$binary_sha256" --packages-run-id "$PACKAGES_RUN" --output "$receipt"
          if [[ "$RELEASE_STAGE" == tag ]]; then
            sh tools/check-version-consistency.sh --release-tag "$GITHUB_REF_NAME" --binary "$binary" \
              --packages-run-id "$PACKAGES_RUN" --performance-receipt "$receipt"
          else
            sh tools/check-version-consistency.sh --release-evidence --binary "$binary" \
              --packages-run-id "$PACKAGES_RUN" --performance-receipt "$receipt"
          fi
      - name: Archive effective qualification without changing the candidate commit
        if: needs.prepare.outputs.release_stage == 'evidence' || needs.prepare.outputs.release_stage == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: effective-qualification-${{ needs.prepare.outputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/effective-qualification.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload exact unsigned release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vaultlink-release-unsigned-${{ needs.prepare.outputs.candidate_commit }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Restore host workspace ownership
        if: always()
        shell: bash
        run: chown -R --reference="$GITHUB_WORKSPACE/.." "$GITHUB_WORKSPACE"

  dry_run:
    name: Verify combined package dry run
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    needs: [prepare, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ${{ needs.prepare.outputs.signing_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Restore host workspace ownership before checkout
        shell: bash
        run: chown -R --reference="$GITHUB_WORKSPACE/.." "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vaultlink-release-unsigned-${{ needs.prepare.outputs.candidate_commit }}
          path: dist
      - name: Verify exact unsigned contract
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sh tools/verify-package-builder.sh debian13-amd64
          sh tools/verify-package-release.sh dist '${{ needs.prepare.outputs.package_version }}'
      - name: Restore host workspace ownership
        if: always()
        shell: bash
        run: chown -R --reference="$GITHUB_WORKSPACE/.." "$GITHUB_WORKSPACE"

  publish:
    name: Sign, draft, re-download, and publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, assemble]
    runs-on: ubuntu-24.04
    environment: release-signing
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      packages: read
    container:
      # The secret-bearing job selects its image directly from protected GitHub
      # configuration and then checks exact equality with the target lock.
      image: ${{ vars.VAULTLINK_PACKAGE_SIGNING_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      PACKAGE_SIGNING_IMAGE: ${{ vars.VAULTLINK_PACKAGE_SIGNING_IMAGE }}
    steps:
      - name: Restore host workspace ownership before checkout
        run: chown -R --reference="$GITHUB_WORKSPACE/.." "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vaultlink-release-unsigned-${{ needs.prepare.outputs.candidate_commit }}
          path: dist
      - name: Verify tag and secret-bearing builder
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ADMIN_READ_TOKEN: ${{ secrets.RELEASE_ADMIN_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_ADMIN_READ_TOKEN"
          test "$(GH_TOKEN="$RELEASE_ADMIN_READ_TOKEN" gh api \
            "repos/$GITHUB_REPOSITORY/immutable-releases" --jq '.enabled')" = true
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 tools/package-targets.py validate
          expected=$(python3 tools/package-targets.py get debian13-amd64 builder_image)
          test "$PACKAGE_SIGNING_IMAGE" = "$expected"
          sh tools/verify-package-builder.sh debian13-amd64
          test "$GITHUB_REF_NAME" = 'v${{ needs.prepare.outputs.package_version }}'
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = '${{ needs.prepare.outputs.candidate_commit }}'
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" \
            = '${{ needs.prepare.outputs.candidate_commit }}'
          sh tools/verify-package-release.sh dist '${{ needs.prepare.outputs.package_version }}'
      - name: Sign exactly nine packages and the global checksum file
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MINISIGN_SECRET_KEY"
          test -n "$MINISIGN_PASSWORD"
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          chmod 0600 "$key"
          printf '%s' "$MINISIGN_SECRET_KEY" >"$key"
          while IFS=$'\t' read -r _target asset; do
            printf '%s\n' "$MINISIGN_PASSWORD" \
              | minisign -S -s "$key" -m "dist/$asset" -x "dist/$asset.minisig"
            minisign -V -q -p release/minisign.pub \
              -m "dist/$asset" -x "dist/$asset.minisig"
          done < <(python3 tools/package-targets.py records '${{ needs.prepare.outputs.package_version }}')
          printf '%s\n' "$MINISIGN_PASSWORD" \
            | minisign -S -s "$key" -m dist/SHA256SUMS -x dist/SHA256SUMS.minisig
          minisign -V -q -p release/minisign.pub \
            -m dist/SHA256SUMS -x dist/SHA256SUMS.minisig
          sh tools/verify-package-release.sh \
            dist '${{ needs.prepare.outputs.package_version }}' --signed
          test "$(find dist -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 21
      - name: Create draft, verify remote assets, then publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ADMIN_READ_TOKEN: ${{ secrets.RELEASE_ADMIN_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_ADMIN_READ_TOKEN"
          local_tag_object=$(git rev-parse "$GITHUB_REF_NAME^{tag}")
          local_tag_commit=$(git rev-parse "$GITHUB_REF_NAME^{commit}")
          remote_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
            --jq '[.object.type,.object.sha] | @tsv')
          IFS=$'\t' read -r remote_ref_type remote_tag_object <<<"$remote_ref"
          test "$remote_ref_type" = tag
          test "$remote_tag_object" = "$local_tag_object"
          remote_tag=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$remote_tag_object" \
            --jq '[.tag,.object.type,.object.sha,.verification.verified,.verification.reason] | @tsv')
          IFS=$'\t' read -r remote_tag_name remote_target_type remote_tag_commit \
            remote_tag_verified remote_tag_verification_reason <<<"$remote_tag"
          test "$remote_tag_name" = "$GITHUB_REF_NAME"
          test "$remote_target_type" = commit
          test "$remote_tag_commit" = "$local_tag_commit"
          test "$remote_tag_commit" = '${{ needs.prepare.outputs.candidate_commit }}'
          test "$remote_tag_verified" = true
          test "$remote_tag_verification_reason" = valid
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" \
            = "$remote_tag_commit"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists" >&2
            exit 73
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "VaultLink $GITHUB_REF_NAME" --notes-file CHANGELOG.md dist/*
          remote=$(mktemp -d)
          gh release download "$GITHUB_REF_NAME" --dir "$remote"
          sh tools/verify-package-release.sh \
            "$remote" '${{ needs.prepare.outputs.package_version }}' --signed
          (
            cd dist
            find . -mindepth 1 -maxdepth 1 -type f -print0 \
              | sort -z | xargs -0 sha256sum
          ) >local-assets.sha256
          (
            cd "$remote"
            find . -mindepth 1 -maxdepth 1 -type f -print0 \
              | sort -z | xargs -0 sha256sum
          ) >remote-assets.sha256
          cmp local-assets.sha256 remote-assets.sha256
          # Publishing is irreversible under the required repository policy.
          # Prove the admin-only setting immediately before changing visibility;
          # if the read-only policy token is absent or insufficient, the fully
          # verified release remains a private draft.
          test "$(GH_TOKEN="$RELEASE_ADMIN_READ_TOKEN" gh api \
            "repos/$GITHUB_REPOSITORY/immutable-releases" --jq '.enabled')" = true
          gh release edit "$GITHUB_REF_NAME" --draft=false
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            --jq '.immutable')" = true
      - name: Restore host workspace ownership
        if: always()
        run: chown -R --reference="$GITHUB_WORKSPACE/.." "$GITHUB_WORKSPACE"

  publish_main_statuses:
    name: Publish exact-commit release preflight statuses
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    needs: [prepare, assemble, dry_run]
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Publish final preflight result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_MODE: ${{ inputs.preflight_mode }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          ASSEMBLE_RESULT: ${{ needs.assemble.result }}
          DRY_RUN_RESULT: ${{ needs.dry_run.result }}
        run: |
          set -euo pipefail
          case "$PREFLIGHT_MODE" in dry-run | candidate | evidence) ;; *) exit 64 ;; esac
          if [[ "$PREPARE_RESULT" == success && "$ASSEMBLE_RESULT" == success \
              && "$DRY_RUN_RESULT" == success ]]; then
            state=success
            description='Nine-package release set and deterministic SBOM/checksum bundle passed'
          else
            state=failure
            description='Package release assembly or preflight gate failed'
          fi
          publish_status() {
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state="$state" -f context="$1" -f description="$2" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          }
          publish_status vaultlink/release-dry-run "$description"
          case "$PREFLIGHT_MODE" in
            candidate)
              publish_status vaultlink/release-candidate-preflight \
                "Pre-soak package candidate preflight: $state"
              ;;
            evidence)
              publish_status vaultlink/release-evidence-preflight \
                "Post-soak package evidence preflight: $state"
              ;;
            dry-run) ;;
          esac
