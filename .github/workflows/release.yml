name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: github.repository_visibility == 'private'
    runs-on: ubuntu-24.04
    container: rust:1.96.1-trixie@sha256:1f0dbad1df66647807e6952d1db85d0b2bda7606cb2139d82517e4f009967376
    env:
      CARGO_TERM_COLOR: always
      SOURCE_DATE_EPOCH: "0"
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates build-essential pkg-config libssl-dev clang git gh minisign xz-utils shellcheck
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = "1.96.1"
          package_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test -n "$package_version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$package_version"
            test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          fi
          sh tools/check-supply-chain-policy.sh
      - name: Install release gates
        run: |
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-cyclonedx --version 0.5.9
      - name: Quality and dependency gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets
          cargo check --manifest-path fuzz/Cargo.toml --locked
          shellcheck deploy/*.sh deploy/docker/*.sh tools/*.sh
          cargo audit --deny warnings
          cargo audit --deny warnings --file fuzz/Cargo.lock
      - name: Build and SBOM
        run: |
          cargo build --locked --release
          cargo cyclonedx --format json
      - name: Assemble deterministic archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          root="VaultLink-${version}-debian13-amd64"
          install -d "dist/$root/bin" "dist/$root/config" "dist/$root/deploy"
          install -m 0755 target/release/vaultlink "dist/$root/bin/vaultlink"
          install -m 0644 README.md CHANGELOG.md SECURITY.md LICENSE rust-toolchain.toml "dist/$root/"
          cp config/*.toml "dist/$root/config/"
          cp -R deploy/. "dist/$root/deploy/"
          if [ -s release/minisign.pub ]; then cp release/minisign.pub "dist/$root/"; fi
          sbom=$(find . -maxdepth 2 -name '*.cdx.json' -print -quit)
          test -n "$sbom"
          install -m 0644 "$sbom" "dist/$root/vaultlink.cdx.json"
          install -m 0644 "$sbom" dist/vaultlink.cdx.json
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -C dist -cf "dist/$root.tar" "$root"
          gzip -n -9 "dist/$root.tar"
          cd dist
          sha256sum "$root.tar.gz" "$root/bin/vaultlink" > SHA256SUMS
      - name: Sign binary and checksums
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test -s release/minisign.pub
          test -n "$MINISIGN_SECRET_KEY"
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          chmod 0600 "$key"
          printf '%s' "$MINISIGN_SECRET_KEY" > "$key"
          version="${GITHUB_REF_NAME#v}"
          root="VaultLink-${version}-debian13-amd64"
          minisign -S -s "$key" -m "dist/$root/bin/vaultlink" -x dist/vaultlink.minisig
          minisign -S -s "$key" -m dist/SHA256SUMS -x dist/SHA256SUMS.minisig
          minisign -V -p release/minisign.pub -m "dist/$root/bin/vaultlink" -x dist/vaultlink.minisig
          minisign -V -p release/minisign.pub -m dist/SHA256SUMS -x dist/SHA256SUMS.minisig
      - name: Create private release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          root="VaultLink-${version}-debian13-amd64"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "VaultLink $GITHUB_REF_NAME" --notes-file CHANGELOG.md \
            "dist/$root.tar.gz" dist/vaultlink.cdx.json dist/SHA256SUMS dist/SHA256SUMS.minisig dist/vaultlink.minisig
      - name: Upload dry-run artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vaultlink-release-dry-run
          path: |
            dist/*.tar.gz
            dist/vaultlink.cdx.json
            dist/SHA256SUMS
