# Install as /etc/systemd/system/vaultlink.service.d/external-proxy-network.conf
# Replace 192.0.2.10 with the external reverse proxy address.
# Match config.toml with allow_non_loopback = true and, for an IPv4 wildcard
# listener, trusted_proxies = ["192.0.2.10", "127.0.0.1"]. The loopback entry
# permits the service's direct readiness probe; unlisted TCP peers are rejected.
[Service]
IPAddressDeny=any
IPAddressAllow=localhost
IPAddressAllow=192.0.2.10/32
