# Install as /etc/systemd/system/vaultlink.service.d/external-proxy-network.conf
# Replace 192.0.2.10 with the external reverse proxy address.
# This network restriction supplements, but never replaces, an mTLS transport
# with a dedicated client CA and pinned client-certificate fingerprint.
# Set allow_non_loopback = true for the application listener. Its trusted_proxies
# list describes optional authenticated forwarding hops, not TCP peers.
# Readiness uses the separate listener on 127.0.0.1:8082.
[Service]
IPAddressDeny=any
IPAddressAllow=localhost
IPAddressAllow=192.0.2.10/32
