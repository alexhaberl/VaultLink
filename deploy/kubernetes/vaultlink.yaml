apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultlink-state
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultlink-storage
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vaultlink
spec:
  selector:
    app: vaultlink
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultlink
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vaultlink
  template:
    metadata:
      labels:
        app: vaultlink
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vaultlink
          image: ghcr.io/alexhaberl/vaultlink:vX.Y.Z
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v2/health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: state
              mountPath: /var/lib/vaultlink
            - name: storage
              mountPath: /mnt/storage
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: vaultlink-state
        - name: storage
          persistentVolumeClaim:
            claimName: vaultlink-storage
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
