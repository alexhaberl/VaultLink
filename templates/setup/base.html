<!doctype html><html lang="{{ locale_code }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }}</title><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="alternate icon" href="/assets/favicon-32.png" type="image/png"><link rel="stylesheet" href="/assets/vaultlink.css"><script src="/assets/setup.js" defer></script></head><body class="vl-ui"><a class="vl-skip-link" href="#main-content">{{ skip_to_content }}</a><div class="vl-setup-shell"><main id="main-content" class="vl-setup-main"><header class="vl-setup-header">{{ brand_html|safe }}{% if show_locale_switcher %}<form class="vl-locale-switch" method="post" action="/locale" aria-label="{{ language_label }}"><input type="hidden" name="return_to" value="{{ return_to }}"><button class="vl-locale-switch__option" name="locale" value="de" type="submit"{% if german %} aria-current="true"{% endif %}>DE</button><span aria-hidden="true">/</span><button class="vl-locale-switch__option" name="locale" value="en" type="submit"{% if english %} aria-current="true"{% endif %}>EN</button></form>{% endif %}</header>{{ body }}</main></div></body></html>
