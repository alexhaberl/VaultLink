<section class="vl-hero"><div><p class="vl-eyebrow"><vl-i18n key="setup.title"/></p><h1><vl-i18n key="setup.initial_setup"/></h1><p class="vl-muted"><vl-i18n key="setup.local_bootstrap"/></p></div><div class="vl-side-panel"><strong><vl-i18n key="setup.security"/></strong><p class="vl-muted"><vl-i18n key="setup.acme_proxy_help"/></p></div></section>
{% if let Some(error) = error %}<p class="vl-danger-text" role="alert">{{ error }}</p>{% endif %}
<form method="post" class="vl-stack" data-setup-token="{{ token }}"><input type="hidden" name="token" value="{{ token }}">
<section class="vl-form-card"><h2><vl-i18n key="setup.server"/></h2><div class="vl-form-grid"><label><vl-i18n key="setup.mode"/><br><select name="server_mode" data-server-mode><option value="development">Development</option><option value="reverse_proxy">Reverse Proxy</option><option value="standalone_tls">Standalone TLS</option></select></label><label><vl-i18n key="setup.service_address"/><br><input name="listen_address" value="127.0.0.1:8080" required><small class="vl-muted"><vl-i18n key="setup.service_address_help"/></small></label><label><vl-i18n key="setup.public_base_url"/><br><input name="public_base_url" value="http://localhost:8080" required></label><label><vl-i18n key="setup.log_level"/><br><select name="log_level"><option value="error">error</option><option value="warn">warn</option><option value="info" selected>info</option><option value="debug">debug</option><option value="trace">trace</option></select></label></div></section>
<section class="vl-form-card"><h2><vl-i18n key="setup.storage"/></h2><div class="vl-form-grid"><label><vl-i18n key="setup.root_mount_path"/><br><div class="vl-input-action"><input name="root_mount_path" value="/tmp/vaultlink-root" required><button class="vl-button vl-button--secondary vl-button--small" type="button" data-dir-picker="root_mount_path"><vl-i18n key="setup.browse"/></button></div></label><label><vl-i18n key="setup.data_directory"/><br><div class="vl-input-action"><input name="data_directory" value="/tmp/vaultlink-data" required><button class="vl-button vl-button--secondary vl-button--small" type="button" data-dir-picker="data_directory"><vl-i18n key="setup.browse"/></button></div></label><label><vl-i18n key="setup.internal_directory"/><br><div class="vl-input-action"><input name="internal_directory" required><button class="vl-button vl-button--secondary vl-button--small" type="button" data-dir-picker="internal_directory"><vl-i18n key="setup.browse"/></button></div></label><label><vl-i18n key="setup.expected_filesystem_type"/><br><input name="expected_filesystem_type" placeholder="ext4 oder cifs" data-mount-policy-field></label><label><vl-i18n key="setup.expected_mount_source"/><br><input name="expected_mount_source" placeholder="/dev/mapper/storage oder //server/share" data-mount-policy-field></label><label class="vl-toggle"><input type="checkbox" name="require_mount" data-require-mount><span><vl-i18n key="setup.require_mount"/><small><vl-i18n key="setup.require_mount_help"/></small></span></label><label class="vl-toggle"><input type="checkbox" name="external_writers" data-external-writers><span><vl-i18n key="setup.external_writers"/><small><vl-i18n key="setup.external_writers_help"/></small></span></label><label><vl-i18n key="setup.max_upload_mb"/><br><input name="max_upload_size_mb" type="number" min="1" step="1" value="100" required></label><label><vl-i18n key="setup.blocked_extensions"/><br><input name="blocked_extensions" value="exe,sh,php"></label></div></section>
<section class="vl-form-card"><h2><vl-i18n key="setup.zip_search_preview"/></h2><div class="vl-form-grid"><label><vl-i18n key="setup.zip_max_gb"/><br><input name="max_zip_size_gb" type="number" min="0" step="1" value="1" required></label><label><vl-i18n key="setup.zip_max_files"/><br><input name="max_zip_files" type="number" min="0" value="10000" required></label><label><vl-i18n key="setup.search_max_entries"/><br><input name="max_search_entries" type="number" min="1" value="50000" required></label><label><vl-i18n key="setup.search_max_results"/><br><input name="max_search_results" type="number" min="1" value="500" required></label><label><vl-i18n key="setup.text_preview_max_mb"/><br><input name="max_preview_size_mb" type="number" min="1" max="{{ max_text_preview_size_mb }}" step="1" value="1" required></label><label><vl-i18n key="setup.text_preview_extensions"/><br><input name="preview_extensions" value="txt,log,md,csv,json,toml,yaml,yml,ini,conf" required></label><label><vl-i18n key="setup.media_preview_max_mb"/><br><input name="max_media_preview_size_mb" type="number" min="1" step="1" value="100" required></label><label><vl-i18n key="setup.image_preview_extensions"/><br><input name="image_preview_extensions" value="jpg,jpeg,png,gif,webp,bmp,avif"></label><label class="vl-toggle"><input type="checkbox" name="pdf_preview_enabled" checked><span><vl-i18n key="setup.pdf_preview_enabled"/><small><vl-i18n key="setup.pdf_preview_help"/></small></span></label></div></section>
<section class="vl-form-card" data-production-section><h2><vl-i18n key="setup.proxy_tls"/></h2><div class="vl-form-grid"><label data-mode-only="reverse_proxy"><vl-i18n key="setup.trusted_proxies"/><br><input name="trusted_proxies" value="127.0.0.1,::1"></label><label data-mode-only="standalone_tls"><vl-i18n key="setup.certificate_source"/><br><select name="certificate_source" data-certificate-source><option value="files"><vl-i18n key="setup.pem_files"/></option><option value="letsencrypt"><vl-i18n key="setup.letsencrypt_auto"/></option></select></label><label data-certificate-only="files"><vl-i18n key="setup.tls_cert_file"/><br><div class="vl-input-action"><input name="tls_cert_file"><button class="vl-button vl-button--secondary vl-button--small" type="button" data-file-picker="tls_cert_file"><vl-i18n key="setup.browse"/></button></div></label><label data-certificate-only="files"><vl-i18n key="setup.tls_key_file"/><br><div class="vl-input-action"><input name="tls_key_file"><button class="vl-button vl-button--secondary vl-button--small" type="button" data-file-picker="tls_key_file"><vl-i18n key="setup.browse"/></button></div></label><label data-certificate-only="letsencrypt"><vl-i18n key="setup.letsencrypt_email"/><br><input name="letsencrypt_contact_email" placeholder="admin@example.com"></label><label data-certificate-only="letsencrypt"><vl-i18n key="setup.acme_cache_directory"/><br><div class="vl-input-action"><input name="letsencrypt_cache_dir" value="acme" required><button class="vl-button vl-button--secondary vl-button--small" type="button" data-dir-picker="letsencrypt_cache_dir"><vl-i18n key="setup.browse"/></button></div></label><label class="vl-toggle" data-certificate-only="letsencrypt"><input type="checkbox" name="letsencrypt_staging" checked><span><vl-i18n key="setup.letsencrypt_staging"/><small><vl-i18n key="setup.letsencrypt_staging_help"/></small></span></label><label class="vl-toggle"><input type="checkbox" name="hsts_enabled"><span><vl-i18n key="setup.hsts_enabled"/><small><vl-i18n key="setup.hsts_help"/></small></span></label></div></section>
<section class="vl-form-card"><h2><vl-i18n key="setup.audit_privacy"/></h2><div class="vl-form-grid"><label class="vl-toggle"><input type="checkbox" name="audit_client_ip_enabled"><span><vl-i18n key="setup.audit_ip"/><small><vl-i18n key="setup.audit_ip_help"/></small></span></label></div></section>
<section class="vl-form-card"><h2><vl-i18n key="setup.first_admin"/></h2><div class="vl-form-grid"><label><vl-i18n key="auth.username"/><br><input name="admin_username" value="admin" minlength="3" maxlength="64" required></label><label><vl-i18n key="auth.password"/><br><input name="admin_password" type="password" minlength="14" maxlength="1024" required></label><label><vl-i18n key="account.confirm_password"/><br><input name="admin_password_confirm" type="password" minlength="14" maxlength="1024" required></label></div></section><p class="vl-form-actions"><button class="vl-button"><vl-i18n key="setup.write"/></button></p></form>
<dialog data-dir-dialog class="vl-dir-dialog"><div class="vl-dir-dialog__head"><strong data-picker-title><vl-i18n key="setup.choose_directory"/></strong><button class="vl-button vl-button--secondary vl-button--small" type="button" data-dir-close><vl-i18n key="common.close"/></button></div><p class="vl-muted" data-dir-current>/</p><div class="vl-button-group"><button class="vl-button vl-button--secondary vl-button--small" type="button" data-dir-up><vl-i18n key="files.up"/></button><button class="vl-button vl-button--small" type="button" data-dir-use><vl-i18n key="setup.use_directory"/></button></div><p class="vl-muted" data-picker-help><vl-i18n key="setup.server_directories_help"/></p><div class="vl-dir-list" data-dir-list></div></dialog>
