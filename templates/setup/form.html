<section class="vl-hero">
  <div><p class="vl-eyebrow"><vl-i18n key="setup.title"/></p><h1><vl-i18n key="setup.initial_setup"/></h1><p class="vl-muted"><vl-i18n key="setup.local_bootstrap"/></p></div>
  <div class="vl-side-panel"><strong><vl-i18n key="setup.security"/></strong><p class="vl-muted"><vl-i18n key="setup.acme_proxy_help"/></p></div>
</section>
{% if let Some(error) = error %}<p class="vl-danger-text" role="alert">{{ error }}</p>{% endif %}
<form method="post" class="vl-stack" data-setup-token="{{ token }}">
  <input type="hidden" name="token" value="{{ token }}">
  <section class="vl-form-card">
    <h2><vl-i18n key="setup.server"/></h2>
    <div class="vl-form-grid">
      <label><span class="vl-field-label"><vl-i18n key="setup.mode"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-mode"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-mode" role="tooltip"><vl-i18n key="setup.mode_help"/></span></span></span><select name="server_mode" data-server-mode><option value="development">Development</option><option value="reverse_proxy">Reverse Proxy</option><option value="standalone_tls">Standalone TLS</option></select></label>
      <label><span class="vl-field-label"><vl-i18n key="setup.service_address"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-service-address"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-service-address" role="tooltip"><vl-i18n key="setup.service_address_help"/></span></span></span><input name="listen_address" value="127.0.0.1:8080" required></label>
      <label><span class="vl-field-label"><vl-i18n key="setup.public_base_url"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-public-base-url"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-public-base-url" role="tooltip"><vl-i18n key="setup.public_base_url_help"/></span></span></span><input name="public_base_url" value="http://localhost:8080" required></label>
      <label><span class="vl-field-label"><vl-i18n key="setup.log_level"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-log-level"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-log-level" role="tooltip"><vl-i18n key="setup.log_level_help"/></span></span></span><select name="log_level"><option value="error">error</option><option value="warn">warn</option><option value="info" selected>info</option><option value="debug">debug</option><option value="trace">trace</option></select></label>
    </div>
  </section>
  <section class="vl-form-card">
    <h2><vl-i18n key="setup.storage"/></h2>
    <div class="vl-form-grid">
      <div class="vl-mount-discovery">
        <label><span class="vl-field-label"><vl-i18n key="setup.detected_cifs_mount"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-detected-mount"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-detected-mount" role="tooltip"><vl-i18n key="setup.detected_cifs_mount_help"/></span></span></span><div class="vl-input-action"><select data-detected-mount disabled><option value=""><vl-i18n key="setup.no_cifs_mounts"/></option></select><button class="vl-button vl-button--secondary vl-button--small" type="button" data-refresh-mounts><vl-i18n key="setup.refresh_cifs_mounts"/></button></div></label>
        <p class="vl-muted" data-mount-status aria-live="polite"><vl-i18n key="setup.cifs_discovery_hint"/></p>
      </div>
      <label><span class="vl-field-label"><vl-i18n key="setup.root_mount_path"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-root-mount"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-root-mount" role="tooltip"><vl-i18n key="setup.root_mount_path_help"/></span></span></span><div class="vl-input-action"><input name="root_mount_path" value="/tmp/vaultlink-root" required><button class="vl-button vl-button--secondary vl-button--small" type="button" data-dir-picker="root_mount_path"><vl-i18n key="setup.browse"/></button></div></label>
      <label><span class="vl-field-label"><vl-i18n key="setup.data_directory"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-data-directory"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-data-directory" role="tooltip"><vl-i18n key="setup.data_directory_help"/></span></span></span><div class="vl-input-action"><input name="data_directory" value="/var/lib/vaultlink" required><button class="vl-button vl-button--secondary vl-button--small" type="button" data-dir-picker="data_directory"><vl-i18n key="setup.browse"/></button></div></label>
      <label><span class="vl-field-label"><vl-i18n key="setup.internal_directory"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-internal-directory"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-internal-directory" role="tooltip"><vl-i18n key="setup.internal_directory_help"/></span></span></span><div class="vl-input-action"><input name="internal_directory" required><button class="vl-button vl-button--secondary vl-button--small" type="button" data-dir-picker="internal_directory"><vl-i18n key="setup.browse"/></button></div></label>
      <label><span class="vl-field-label"><vl-i18n key="setup.expected_filesystem_type"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-filesystem-type"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-filesystem-type" role="tooltip"><vl-i18n key="setup.expected_filesystem_type_help"/></span></span></span><select name="expected_filesystem_type" data-mount-policy-field><option value=""><vl-i18n key="setup.select_filesystem_type"/></option><optgroup label="Local"><option value="ext2">ext2</option><option value="ext3">ext3</option><option value="ext4">ext4</option><option value="xfs">xfs</option><option value="btrfs">btrfs</option><option value="f2fs">f2fs</option><option value="bcachefs">bcachefs</option><option value="zfs">zfs</option></optgroup><optgroup label="SMB"><option value="cifs">cifs</option></optgroup></select></label>
      <input type="hidden" name="expected_mount_source" data-mount-policy-field>
      <label class="vl-toggle"><input type="checkbox" name="require_mount" data-require-mount><span><span class="vl-field-label"><vl-i18n key="setup.require_mount"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-require-mount"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-require-mount" role="tooltip"><vl-i18n key="setup.require_mount_help"/></span></span></span></span></label>
      <label class="vl-toggle" data-external-writers-field><input type="checkbox" name="external_writers" data-external-writers><span><span class="vl-field-label"><vl-i18n key="setup.external_writers"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-external-writers"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-external-writers" role="tooltip"><vl-i18n key="setup.external_writers_help"/></span></span></span></span></label>
      <label class="vl-toggle" data-external-writer-replace-field><input type="checkbox" name="allow_external_writer_replace" data-external-writer-replace><span><span class="vl-field-label"><vl-i18n key="setup.external_writer_replace"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-external-writer-replace"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-external-writer-replace" role="tooltip"><vl-i18n key="setup.external_writer_replace_help"/></span></span></span></span></label>
      <label><span class="vl-field-label"><vl-i18n key="setup.max_upload_mb"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-max-upload"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-max-upload" role="tooltip"><vl-i18n key="setup.max_upload_mb_help"/></span></span></span><input name="max_upload_size_mb" type="number" min="1" step="1" value="50000" required></label>
      <label><span class="vl-field-label"><vl-i18n key="setup.blocked_extensions"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-blocked-extensions"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-blocked-extensions" role="tooltip"><vl-i18n key="setup.blocked_extensions_help"/></span></span></span><input name="blocked_extensions" value="exe,sh,php"></label>
    </div>
  </section>
  <section class="vl-form-card">
    <h2><vl-i18n key="setup.zip_search_preview"/></h2>
    <div class="vl-form-grid">
      <label><span class="vl-field-label"><vl-i18n key="setup.zip_max_gb"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-zip-size"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-zip-size" role="tooltip"><vl-i18n key="setup.zip_max_gb_help"/></span></span></span><input name="max_zip_size_gb" type="number" min="0" step="1" value="20" required></label>
      <label><span class="vl-field-label"><vl-i18n key="setup.zip_max_files"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-zip-files"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-zip-files" role="tooltip"><vl-i18n key="setup.zip_max_files_help"/></span></span></span><input name="max_zip_files" type="number" min="0" value="10000" required></label>
      <label><span class="vl-field-label"><vl-i18n key="setup.search_max_entries"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-search-entries"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-search-entries" role="tooltip"><vl-i18n key="setup.search_max_entries_help"/></span></span></span><input name="max_search_entries" type="number" min="1" value="50000" required></label>
      <label><span class="vl-field-label"><vl-i18n key="setup.search_max_results"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-search-results"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-search-results" role="tooltip"><vl-i18n key="setup.search_max_results_help"/></span></span></span><input name="max_search_results" type="number" min="1" value="500" required></label>
      <label><span class="vl-field-label"><vl-i18n key="setup.text_preview_max_mb"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-text-preview-size"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-text-preview-size" role="tooltip"><vl-i18n key="setup.text_preview_max_mb_help"/></span></span></span><input name="max_preview_size_mb" type="number" min="1" max="{{ max_text_preview_size_mb }}" step="1" value="50" required></label>
      <label><span class="vl-field-label"><vl-i18n key="setup.text_preview_extensions"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-text-preview-extensions"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-text-preview-extensions" role="tooltip"><vl-i18n key="setup.text_preview_extensions_help"/></span></span></span><input name="preview_extensions" value="txt,log,md,csv,json,toml,yaml,yml,ini,conf" required></label>
      <label><span class="vl-field-label"><vl-i18n key="setup.media_preview_max_mb"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-media-preview-size"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-media-preview-size" role="tooltip"><vl-i18n key="setup.media_preview_max_mb_help"/></span></span></span><input name="max_media_preview_size_mb" type="number" min="1" step="1" value="100" required></label>
      <label><span class="vl-field-label"><vl-i18n key="setup.image_preview_extensions"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-image-preview-extensions"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-image-preview-extensions" role="tooltip"><vl-i18n key="setup.image_preview_extensions_help"/></span></span></span><input name="image_preview_extensions" value="jpg,jpeg,png,gif,webp,bmp,avif"></label>
      <label class="vl-toggle"><input type="checkbox" name="pdf_preview_enabled" checked><span><span class="vl-field-label"><vl-i18n key="setup.pdf_preview_enabled"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-pdf-preview"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-pdf-preview" role="tooltip"><vl-i18n key="setup.pdf_preview_help"/></span></span></span></span></label>
    </div>
  </section>
  <section class="vl-form-card" data-production-section>
    <h2><vl-i18n key="setup.proxy_tls"/></h2>
    <div class="vl-form-grid">
      <label data-mode-only="reverse_proxy"><span class="vl-field-label"><vl-i18n key="setup.trusted_proxies"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-trusted-proxies"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-trusted-proxies" role="tooltip"><vl-i18n key="setup.trusted_proxies_help"/></span></span></span><input name="trusted_proxies" value="127.0.0.1,::1"></label>
      <label data-mode-only="standalone_tls"><span class="vl-field-label"><vl-i18n key="setup.certificate_source"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-certificate-source"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-certificate-source" role="tooltip"><vl-i18n key="setup.certificate_source_help"/></span></span></span><select name="certificate_source" data-certificate-source><option value="files"><vl-i18n key="setup.pem_files"/></option><option value="letsencrypt"><vl-i18n key="setup.letsencrypt_auto"/></option></select></label>
      <label data-certificate-only="files"><span class="vl-field-label"><vl-i18n key="setup.tls_cert_file"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-tls-cert"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-tls-cert" role="tooltip"><vl-i18n key="setup.tls_cert_file_help"/></span></span></span><div class="vl-input-action"><input name="tls_cert_file"><button class="vl-button vl-button--secondary vl-button--small" type="button" data-file-picker="tls_cert_file"><vl-i18n key="setup.browse"/></button></div></label>
      <label data-certificate-only="files"><span class="vl-field-label"><vl-i18n key="setup.tls_key_file"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-tls-key"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-tls-key" role="tooltip"><vl-i18n key="setup.tls_key_file_help"/></span></span></span><div class="vl-input-action"><input name="tls_key_file"><button class="vl-button vl-button--secondary vl-button--small" type="button" data-file-picker="tls_key_file"><vl-i18n key="setup.browse"/></button></div></label>
      <label data-certificate-only="letsencrypt"><span class="vl-field-label"><vl-i18n key="setup.letsencrypt_email"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-letsencrypt-email"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-letsencrypt-email" role="tooltip"><vl-i18n key="setup.letsencrypt_email_help"/></span></span></span><input name="letsencrypt_contact_email" placeholder="admin@example.com"></label>
      <label data-certificate-only="letsencrypt"><span class="vl-field-label"><vl-i18n key="setup.acme_cache_directory"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-acme-cache"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-acme-cache" role="tooltip"><vl-i18n key="setup.acme_cache_directory_help"/></span></span></span><div class="vl-input-action"><input name="letsencrypt_cache_dir" value="acme" required><button class="vl-button vl-button--secondary vl-button--small" type="button" data-dir-picker="letsencrypt_cache_dir"><vl-i18n key="setup.browse"/></button></div></label>
      <label class="vl-toggle" data-certificate-only="letsencrypt"><input type="checkbox" name="letsencrypt_staging" checked><span><span class="vl-field-label"><vl-i18n key="setup.letsencrypt_staging"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-letsencrypt-staging"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-letsencrypt-staging" role="tooltip"><vl-i18n key="setup.letsencrypt_staging_help"/></span></span></span></span></label>
      <label class="vl-toggle"><input type="checkbox" name="hsts_enabled"><span><span class="vl-field-label"><vl-i18n key="setup.hsts_enabled"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-hsts"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-hsts" role="tooltip"><vl-i18n key="setup.hsts_help"/></span></span></span></span></label>
    </div>
  </section>
  <section class="vl-form-card">
    <h2><vl-i18n key="setup.audit_privacy"/></h2>
    <div class="vl-form-grid"><label class="vl-toggle"><input type="checkbox" name="audit_client_ip_enabled"><span><span class="vl-field-label"><vl-i18n key="setup.audit_ip"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-audit-ip"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-audit-ip" role="tooltip"><vl-i18n key="setup.audit_ip_help"/></span></span></span></span></label></div>
  </section>
  <section class="vl-form-card">
    <h2><vl-i18n key="setup.first_admin"/></h2>
    <div class="vl-form-grid">
      <label><span class="vl-field-label"><vl-i18n key="auth.username"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-admin-username"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-admin-username" role="tooltip"><vl-i18n key="setup.admin_username_help"/></span></span></span><input name="admin_username" value="admin" minlength="3" maxlength="64" required></label>
      <label><span class="vl-field-label"><vl-i18n key="auth.password"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-admin-password"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-admin-password" role="tooltip"><vl-i18n key="setup.admin_password_help"/></span></span></span><input name="admin_password" type="password" minlength="14" maxlength="1024" required></label>
      <label><span class="vl-field-label"><vl-i18n key="account.confirm_password"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="setup-help-admin-password-confirm"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="setup-help-admin-password-confirm" role="tooltip"><vl-i18n key="setup.admin_password_confirm_help"/></span></span></span><input name="admin_password_confirm" type="password" minlength="14" maxlength="1024" required></label>
    </div>
  </section>
  <p class="vl-form-actions"><button class="vl-button"><vl-i18n key="setup.write"/></button></p>
</form>
<dialog data-dir-dialog class="vl-dir-dialog"><div class="vl-dir-dialog__head"><strong data-picker-title><vl-i18n key="setup.choose_directory"/></strong><button class="vl-button vl-button--secondary vl-button--small" type="button" data-dir-close><vl-i18n key="common.close"/></button></div><p class="vl-muted" data-dir-current>/</p><div class="vl-button-group"><button class="vl-button vl-button--secondary vl-button--small" type="button" data-dir-up><vl-i18n key="files.up"/></button><button class="vl-button vl-button--small" type="button" data-dir-use><vl-i18n key="setup.use_directory"/></button></div><p class="vl-muted" data-picker-help><vl-i18n key="setup.server_directories_help"/></p><div class="vl-dir-list" data-dir-list></div></dialog>
