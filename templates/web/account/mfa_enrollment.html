<section class="vl-panel vl-stack"><div><p class="vl-eyebrow"><vl-i18n key="account.change_mfa"/></p><h2><vl-i18n key="account.mfa_enrollment_flow"/></h2></div><p class="vl-muted"><vl-i18n key="account.old_mfa_valid"/></p><div class="vl-qr-card" aria-label="TOTP QR-Code">{{ qr|safe }}</div><div class="vl-secret-block"><code>{{ secret }}</code><code>{{ otpauth }}</code></div><p class="vl-muted"><vl-i18n key="public.valid_until"/>: {{ expires_at }}</p><form method="post" action="/admin/account/mfa/confirm" class="vl-stack"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="enrollment_token" value="{{ enrollment_token }}"><label class="vl-field"><vl-i18n key="account.new_mfa_test_code"/><input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" required></label><div class="vl-inline-actions"><button class="vl-button" type="submit"><vl-i18n key="common.confirm"/></button><a class="vl-button vl-button--secondary" href="/admin/account"><vl-i18n key="common.cancel"/></a></div></form></section>
