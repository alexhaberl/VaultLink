<section class="vl-panel"><h1><vl-i18n key="files.preview"/></h1><p class="vl-inline-actions"><a class="vl-button vl-button--secondary" href="{{ back_link }}"><vl-i18n key="share.back"/></a><a class="vl-button vl-button--secondary" href="{{ download_link }}"><vl-i18n key="common.download"/></a></p><p class="vl-muted">{{ size }} - <vl-i18n key="files.raw_token"/></p>{% if image %}<img class="vl-media-preview vl-media-preview--image" src="{{ raw_url }}" alt="<vl-i18n key="files.preview_alt"/>">{% else %}<iframe class="vl-media-preview vl-media-preview--pdf" src="{{ raw_url }}" title="<vl-i18n key="files.pdf_preview"/>"></iframe>{% endif %}</section>
