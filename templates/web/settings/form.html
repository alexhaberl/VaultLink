<section class="vl-panel">
  <h2><vl-i18n key="settings.runtime"/></h2>
  {% if message.is_some() %}<p class="vl-muted">{{ message.as_ref().unwrap() }}</p>{% endif %}
  <p class="vl-muted"><vl-i18n key="settings.runtime_help"/></p>
  <form method="post" class="vl-form-grid">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label><span class="vl-field-label">Public Base URL<span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="settings-help-public-base-url"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="settings-help-public-base-url" role="tooltip"><vl-i18n key="settings.public_base_url_help"/></span></span></span><input name="public_base_url" value="{{ public_base_url }}"{% if public_url_locked %} readonly aria-readonly="true"{% endif %} required><small>{{ public_url_hint }}</small></label>
    <label><span class="vl-field-label"><vl-i18n key="settings.upload_limit"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="settings-help-upload-limit"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="settings-help-upload-limit" role="tooltip"><vl-i18n key="settings.upload_limit_help"/></span></span></span><input name="max_upload_size_gb" type="number" min="1" max="{{ max_upload_size_gb_ceiling }}" step="1" value="{{ max_upload_size_gb }}" required></label>
    <label><span class="vl-field-label"><vl-i18n key="settings.blocked"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="settings-help-blocked-extensions"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="settings-help-blocked-extensions" role="tooltip"><vl-i18n key="settings.blocked_help"/></span></span></span><input name="blocked_extensions" value="{{ blocked_extensions }}"></label>
    <label><span class="vl-field-label"><vl-i18n key="settings.password_min"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="settings-help-password-min"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="settings-help-password-min" role="tooltip"><vl-i18n key="settings.password_min_help"/></span></span></span><input name="share_password_min_length" type="number" min="8" value="{{ share_password_min_length }}" required></label>
    <label><span class="vl-field-label"><vl-i18n key="settings.password_max"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="settings-help-password-max"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="settings-help-password-max" role="tooltip"><vl-i18n key="settings.password_max_help"/></span></span></span><input name="share_password_max_length" type="number" min="8" value="{{ share_password_max_length }}" required></label>
    <label><span class="vl-field-label"><vl-i18n key="settings.unlock_minutes"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="settings-help-unlock-minutes"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="settings-help-unlock-minutes" role="tooltip"><vl-i18n key="settings.unlock_minutes_help"/></span></span></span><input name="share_unlock_minutes" type="number" min="1" value="{{ share_unlock_minutes }}" required></label>
    <label><span class="vl-field-label"><vl-i18n key="settings.zip_gb"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="settings-help-zip-gb"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="settings-help-zip-gb" role="tooltip"><vl-i18n key="settings.zip_gb_help"/></span></span></span><input name="max_zip_size_gb" type="number" min="0" step="1" value="{{ max_zip_size_gb }}" required></label>
    <label><span class="vl-field-label"><vl-i18n key="settings.zip_files"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="settings-help-zip-files"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="settings-help-zip-files" role="tooltip"><vl-i18n key="settings.zip_files_help"/></span></span></span><input name="max_zip_files" type="number" min="0" value="{{ max_zip_files }}" required></label>
    <label><span class="vl-field-label"><vl-i18n key="settings.search_entries"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="settings-help-search-entries"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="settings-help-search-entries" role="tooltip"><vl-i18n key="settings.search_entries_help"/></span></span></span><input name="max_search_entries" type="number" min="1" value="{{ max_search_entries }}" required></label>
    <label><span class="vl-field-label"><vl-i18n key="settings.search_results"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="settings-help-search-results"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="settings-help-search-results" role="tooltip"><vl-i18n key="settings.search_results_help"/></span></span></span><input name="max_search_results" type="number" min="1" value="{{ max_search_results }}" required></label>
    <label><span class="vl-field-label"><vl-i18n key="settings.text_preview"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="settings-help-text-preview"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="settings-help-text-preview" role="tooltip"><vl-i18n key="settings.text_preview_help"/></span></span></span><input name="max_preview_size_mb" type="number" min="1" max="{{ max_text_preview_size_mb }}" step="1" value="{{ max_preview_size_mb }}" required></label>
    <label><span class="vl-field-label"><vl-i18n key="settings.text_extensions"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="settings-help-text-extensions"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="settings-help-text-extensions" role="tooltip"><vl-i18n key="settings.text_extensions_help"/></span></span></span><input name="preview_extensions" value="{{ preview_extensions }}" required></label>
    <label><span class="vl-field-label"><vl-i18n key="settings.media_preview"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="settings-help-media-preview"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="settings-help-media-preview" role="tooltip"><vl-i18n key="settings.media_preview_help"/></span></span></span><input name="max_media_preview_size_mb" type="number" min="1" step="1" value="{{ max_media_preview_size_mb }}" required></label>
    <label><span class="vl-field-label"><vl-i18n key="settings.image_extensions"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="settings-help-image-extensions"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="settings-help-image-extensions" role="tooltip"><vl-i18n key="settings.image_extensions_help"/></span></span></span><input name="image_preview_extensions" value="{{ image_preview_extensions }}"></label>
    <label class="vl-toggle"><input type="checkbox" name="pdf_preview_enabled"{% if pdf_preview_enabled %} checked{% endif %}><span><span class="vl-field-label"><vl-i18n key="settings.pdf_active"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="settings-help-pdf-preview"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="settings-help-pdf-preview" role="tooltip"><vl-i18n key="settings.pdf_help"/></span></span></span></span></label>
    <label class="vl-toggle"><input type="checkbox" name="audit_client_ip_enabled"{% if audit_client_ip_enabled %} checked{% endif %}><span><span class="vl-field-label"><vl-i18n key="settings.audit_ip"/><span class="vl-field-info" role="button" tabindex="0" aria-label='<vl-i18n key="setup.field_info"/>' aria-describedby="settings-help-audit-ip"><span aria-hidden="true">i</span><span class="vl-field-tooltip" id="settings-help-audit-ip" role="tooltip"><vl-i18n key="settings.audit_ip_help"/></span></span></span></span></label>
    <button class="vl-button"><vl-i18n key="common.save"/></button>
  </form>
  {% if show_purge_link %}<p><a class="vl-button vl-button--danger" href="/admin/settings/audit-ips/delete">{{ audit_ip_count }} <vl-i18n key="settings.delete_ips"/></a></p>{% endif %}
</section>
