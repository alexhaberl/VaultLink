<section class="vl-panel vl-confirm-card">
  <h2><vl-i18n key="settings.delete_ip_data"/></h2>
  <p><vl-i18n key="settings.values_prefix"/> <strong>{{ count }}</strong> <vl-i18n key="settings.delete_ip_values"/></p>
  <form method="post" action="/admin/settings/audit-ips/delete" class="vl-stack">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label class="vl-field"><vl-i18n key="settings.enter_confirm"/> <code>IP-DATEN LÖSCHEN</code><input name="confirmation" autocomplete="off" required></label>
    <div class="vl-inline-actions"><button class="vl-button vl-button--danger"><vl-i18n key="settings.delete_ip_action"/></button><a class="vl-button vl-button--secondary" href="/admin/settings"><vl-i18n key="common.cancel"/></a></div>
  </form>
</section>
