<section class="vl-panel"><h2><vl-i18n key="nav.admins"/></h2>{% if password_reset %}<p class="vl-notice vl-notice--success"><vl-i18n key="admins.password_set"/></p>{% endif %}<div class="vl-stack">{% for group in groups %}<details class="vl-form-card" open><summary><vl-i18n key="{{ group.label_key }}"/></summary><div class="vl-table-wrap"><table class="vl-data-table"><thead><tr><th>ID</th><th><vl-i18n key="auth.username"/></th><th><vl-i18n key="common.created"/></th><th><vl-i18n key="common.action"/></th></tr></thead><tbody>{% if group.rows.is_empty() %}<tr><td colspan="4" class="vl-muted"><vl-i18n key="{{ group.empty_key }}"/></td></tr>{% else %}{% for admin in group.rows %}<tr><td data-label="ID">{{ admin.id }}</td><td data-label="{{ username_label }}">{{ admin.username }}</td><td data-label="{{ created_label }}">{{ admin.created_at }}</td><td data-label="{{ action_label }}"><div class="vl-stack">{% if admin.current %}<span class="vl-badge vl-badge--accent"><vl-i18n key="admins.current"/></span>{% else %}<div class="vl-button-group"><form method="post" action="/admin/admins/{{ admin.id }}/{% if admin.active %}deactivate{% else %}activate{% endif %}"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="vl-button{% if admin.active %} vl-button--secondary{% endif %}"><vl-i18n key="{% if admin.active %}admins.deactivate{% else %}admins.activate{% endif %}"/></button></form><form method="post" action="/admin/admins/{{ admin.id }}/totp"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="vl-button vl-button--secondary"><vl-i18n key="admins.reset_mfa"/></button></form></div><form method="post" action="/admin/admins/{{ admin.id }}/password" class="vl-form-grid"><input type="hidden" name="csrf" value="{{ csrf }}"><label class="vl-field"><vl-i18n key="account.new_password"/><input name="password" type="password" minlength="14" maxlength="256" required></label><label class="vl-field"><vl-i18n key="common.confirm"/><input name="password_confirm" type="password" minlength="14" maxlength="256" required></label><button class="vl-button"><vl-i18n key="admins.set_password"/></button></form>{% endif %}</div></td></tr>{% endfor %}{% endif %}</tbody></table></div></details>{% endfor %}</div></section><section class="vl-panel"><h2><vl-i18n key="admins.create"/></h2><form method="post" class="vl-admin-create-form"><input type="hidden" name="csrf" value="{{ csrf }}"><label class="vl-field"><vl-i18n key="auth.username"/><input name="username" pattern="[A-Za-z0-9_-]{3,64}" required></label><label class="vl-field"><vl-i18n key="auth.password"/><input name="password" type="password" minlength="14" maxlength="256" required></label><label class="vl-field"><vl-i18n key="account.confirm_password"/><input name="password_confirm" type="password" minlength="14" maxlength="256" required></label><button class="vl-button"><vl-i18n key="common.create"/></button></form></section>
