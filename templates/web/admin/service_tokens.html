<section class="vl-panel vl-stack"><div><p class="vl-eyebrow"><vl-i18n key="service_tokens.eyebrow"/></p><h2><vl-i18n key="nav.service_tokens"/></h2><p class="vl-muted"><vl-i18n key="service_tokens.help"/></p></div>{% if revoked %}<p class="vl-notice vl-notice--success"><vl-i18n key="service_tokens.revoked"/></p>{% endif %}<div class="vl-table-wrap"><table class="vl-data-table"><thead><tr><th>ID</th><th><vl-i18n key="service_tokens.name"/></th><th><vl-i18n key="service_tokens.scope"/></th><th><vl-i18n key="service_tokens.created_by"/></th><th><vl-i18n key="common.created"/></th><th><vl-i18n key="service_tokens.expires"/></th><th><vl-i18n key="service_tokens.last_used"/></th><th><vl-i18n key="common.status"/></th><th><vl-i18n key="common.action"/></th></tr></thead><tbody>{% if rows.is_empty() %}<tr><td colspan="9" class="vl-muted"><vl-i18n key="service_tokens.empty"/></td></tr>{% else %}{% for token in rows %}<tr><td data-label="ID">{{ token.id }}</td><td data-label="{{ name_label }}"><strong>{{ token.name }}</strong></td><td data-label="{{ scope_label }}"><code>{{ token.scope }}</code></td><td data-label="{{ created_by_label }}">{{ token.created_by }}</td><td data-label="{{ created_label }}">{{ token.created_at }}</td><td data-label="{{ expires_label }}">{{ token.expires_at }}</td><td data-label="{{ last_used_label }}">{{ token.last_used_at }}</td><td data-label="{{ status_label }}"><span class="vl-badge vl-badge--{{ token.status_tone }}"><vl-i18n key="{{ token.status_key }}"/></span></td><td data-label="{{ action_label }}"><form method="post" action="/admin/service-tokens/{{ token.id }}/revoke"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="vl-button vl-button--danger vl-button--small" type="submit"><vl-i18n key="service_tokens.revoke"/></button></form></td></tr>{% endfor %}{% endif %}</tbody></table></div></section><section class="vl-panel vl-stack"><div><h2><vl-i18n key="service_tokens.create"/></h2><p class="vl-muted"><vl-i18n key="service_tokens.create_help"/></p></div><form method="post" action="/admin/service-tokens" class="vl-stack" data-optional-expiry><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="expires_tz_offset_minutes" data-tz-offset value="0"><div class="vl-form-grid"><label class="vl-field"><vl-i18n key="service_tokens.name"/><input name="name" minlength="{{ name_min_length }}" maxlength="{{ name_max_length }}" autocomplete="off" required><small><vl-i18n key="service_tokens.name_help"/></small></label><label class="vl-field"><vl-i18n key="service_tokens.expires"/><input name="expires_at" type="datetime-local" value="{{ default_expires_at }}" data-expiry-input data-default-expiry-months="12" required><small><vl-i18n key="service_tokens.expiry_help"/></small></label></div><label class="vl-switch"><input name="no_expiry" type="checkbox" value="1" data-no-expiry><span><vl-i18n key="service_tokens.no_expiry"/><small><vl-i18n key="service_tokens.no_expiry_help"/></small></span></label><p class="vl-notice vl-notice--warning"><vl-i18n key="service_tokens.no_expiry_warning"/></p><label class="vl-field"><vl-i18n key="account.current_password"/><input name="current_password" type="password" maxlength="{{ password_max_length }}" autocomplete="current-password" required><small><vl-i18n key="service_tokens.password_help"/></small></label><button class="vl-button vl-button--primary" type="submit"><vl-i18n key="service_tokens.create"/></button></form></section>
