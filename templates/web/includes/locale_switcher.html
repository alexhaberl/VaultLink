<form class="vl-locale-switch" method="post" action="/locale" aria-label="{{ shell.language_label }}"><input type="hidden" name="return_to" value="{{ shell.return_to }}"><button class="vl-locale-switch__option" name="locale" value="de" type="submit"{% if shell.german %} aria-current="true"{% endif %}>DE</button><span aria-hidden="true">/</span><button class="vl-locale-switch__option" name="locale" value="en" type="submit"{% if shell.english %} aria-current="true"{% endif %}>EN</button></form>
