<section class="vl-panel vl-auth-card"><h1><vl-i18n key="auth.second_factor"/></h1><form method="post" class="vl-stack"><input type="hidden" name="csrf" value="{{ csrf }}"><label class="vl-field"><vl-i18n key="auth.six_digit_totp"/><input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" required></label><button class="vl-button"><vl-i18n key="auth.verify"/></button></form>{% if security_key_enabled %}<hr><button type="button" data-security-key-login data-csrf="{{ csrf }}"><vl-i18n key="auth.security_key_use"/></button><p class="vl-muted" data-security-key-status role="status" aria-live="polite"></p>{% endif %}</section>
