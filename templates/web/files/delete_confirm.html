<section class="vl-panel vl-confirm-card"><h2>{{ heading }}</h2><p><code>/{{ path }}</code></p><p class="vl-danger-text"><vl-i18n key="files.delete_irreversible"/></p><p><vl-i18n key="files.affected_shares"/> <strong>{{ affected_shares }}</strong></p><form method="post" action="/admin/files/delete" class="vl-stack"{% if confirmation_required %} data-delete-confirmation data-required-name="{{ name }}"{% endif %}><input type="hidden" name="csrf" value="{{ csrf_token }}"><input type="hidden" name="path" value="{{ path }}">{% if confirmation_required %}<div class="vl-form-card"><p class="vl-danger-text"><strong><vl-i18n key="common.warning"/></strong> <vl-i18n key="files.folder_not_empty"/></p><label class="vl-field"><vl-i18n key="files.confirm_folder_name"/> <code>{{ name }}</code> <vl-i18n key="files.enter"/><input name="confirm_name" autocomplete="off" data-confirm-input autofocus required></label></div>{% endif %}<div class="vl-inline-actions"><button class="vl-button vl-button--danger"{% if confirmation_required %} data-confirm-delete disabled{% endif %}><vl-i18n key="files.permanent_delete"/></button><a class="vl-button vl-button--secondary" href="/admin?path={{ parent_path }}"><vl-i18n key="common.cancel"/></a></div></form></section>
