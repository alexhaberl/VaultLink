[package]
name = "vaultlink-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
axum = "0.8"
futures-util = "0.3"
libfuzzer-sys = "0.4"
tempfile = "3.27"
tokio = { version = "1", features = ["rt"] }
vaultlink = { path = "..", features = ["fuzzing"] }

[[bin]]
name = "path_normalization"
path = "fuzz_targets/path_normalization.rs"
test = false
doc = false
bench = false

[[bin]]
name = "byte_range"
path = "fuzz_targets/byte_range.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filename"
path = "fuzz_targets/filename.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zip_search_preview_paths"
path = "fuzz_targets/zip_search_preview_paths.rs"
test = false
doc = false
bench = false

[[bin]]
name = "upload_overwrite_policy"
path = "fuzz_targets/upload_overwrite_policy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "upload_request_state"
path = "fuzz_targets/upload_request_state.rs"
test = false
doc = false
