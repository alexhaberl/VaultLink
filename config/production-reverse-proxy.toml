[server]
mode = "reverse_proxy"
listen_address = "127.0.0.1:8080"
public_base_url = "https://files.example.com"
production_mode = true

[storage]
root_mount_path = "/mnt/storage"
data_directory = "/var/lib/vaultlink"
internal_directory = "/mnt/storage/.vaultlink-internal"
# Pre-provision internal_directory/{uploads,tombstones}. The SMB server ACL
# grants only the VaultLink account access. Co-writers get the required Modify
# rights for user data in the share root but no read/write/delete/rename/
# DELETE_CHILD/WRITE_DAC/WRITE_OWNER rights on this reserved private child.
require_mount = true
external_writers = true
allow_external_writer_replace = false
expected_filesystem_type = "cifs"
expected_mount_source = "//fileserver.example/vaultlink"
# Setup/UI units are decimal: 1 GB = 1,000,000,000 bytes. Caddy's
# request-body cap is 1002 MB so the payload plus multipart overhead fits.
max_upload_size = 1000000000
max_zip_size = 1000000000
max_zip_files = 10000
max_search_entries = 50000
max_search_results = 500
# Text previews are limited to at most 64 MB.
max_preview_size = 1000000
preview_extensions = ["txt", "log", "md", "csv", "json", "toml", "yaml", "yml", "ini", "conf"]
image_preview_extensions = ["jpg", "jpeg", "png", "gif", "webp", "bmp", "avif"]
pdf_preview_enabled = true
max_media_preview_size = 100000000
blocked_extensions = ["exe", "dll", "com", "bat", "cmd", "ps1", "sh"]

[security]
session_hours = 12
session_idle_minutes = 30
login_attempts = 5
login_window_seconds = 300
secure_cookie = true
share_password_min_length = 12
share_password_max_length = 256
share_unlock_minutes = 60
share_password_attempts = 5
audit_client_ip_enabled = false

[reverse_proxy]
enabled = true
allow_non_loopback = false
# This is both the exact TCP-peer allowlist and the trust boundary for
# forwarded headers. The local listener/readiness peers are listed explicitly.
# For an external proxy with listen_address = "0.0.0.0:8080", use for example:
# allow_non_loopback = true
# trusted_proxies = ["192.0.2.10", "127.0.0.1"]
trusted_proxies = ["127.0.0.1", "::1"]
trust_x_forwarded_headers = true

[tls]
enabled = false
certificate_source = "files"
hsts_enabled = true
reload_on_cert_change = false

[logging]
level = "info"
