[server]
mode = "development"
listen_address = "127.0.0.1:8080"
public_base_url = "http://localhost:8080"
production_mode = false

[storage]
root_mount_path = "dev/mount"
data_directory = "dev/data"
internal_directory = "dev/mount/.vaultlink-internal"
require_mount = false
external_writers = false
allow_external_writer_replace = false
# Setup/UI units are decimal: 1 MB = 1,000,000 bytes; 1 GB = 1,000,000,000 bytes.
max_upload_size = 100000000
max_zip_size = 1000000000
max_zip_files = 10000
max_search_entries = 50000
max_search_results = 500
# Text previews are limited to at most 64 MB.
max_preview_size = 1000000
preview_extensions = ["txt", "log", "md", "csv", "json", "toml", "yaml", "yml", "ini", "conf"]
image_preview_extensions = ["jpg", "jpeg", "png", "gif", "webp", "bmp", "avif"]
pdf_preview_enabled = true
max_media_preview_size = 100000000
blocked_extensions = ["exe", "dll", "com", "bat", "cmd", "ps1", "sh"]

[security]
session_hours = 12
login_attempts = 5
login_window_seconds = 300
secure_cookie = false
share_password_min_length = 12
share_password_max_length = 256
share_unlock_minutes = 60
share_password_attempts = 5
audit_client_ip_enabled = false

[reverse_proxy]
enabled = false
allow_non_loopback = false
trusted_proxies = []
trust_x_forwarded_headers = false

[tls]
enabled = false
certificate_source = "files"
hsts_enabled = false
reload_on_cert_change = false

[logging]
level = "info,vaultlink=debug"
